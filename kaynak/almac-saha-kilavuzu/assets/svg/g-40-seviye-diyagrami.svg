<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g40">
<title id="t-g40">Referans ön uç kaskadının seviye diyagramı (hesaplanmış, B = 300 MHz). Üstte blok sembolleri: limiter, LNA, preselector, mixer, IF filtre, IF yükselteç, AAF + sürücü. Altta bloktan bloğa sinyal seviyesi (mavi, −60 dBm girişten −20 dBm çıkışa) ve gürültü seviyesi (gri dolgu). Girişte SNR 29.2 dB, çıkışta 25.8 dB; fark 3.45 dB = Friis ile kaskad NF'i. Her bloğun altında kümülatif NF: LNA'dan sonra neredeyse değişmez. ADC tam ölçeği +4 dBm altın kesikli.</title>
