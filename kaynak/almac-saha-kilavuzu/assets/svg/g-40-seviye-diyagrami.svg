<text x="510" y="446" text-anchor="middle" class="s-metin2">Friis: kaskad NF = 3.45 dB = SNR kaybı (29.2 → 25.8 dB). LNA'dan sonraki blokların katkısı 20 dB kazançla bölünür.</text>
<text x="510" y="464" text-anchor="middle" class="s-kucuk">Sistem bütçesi NF = 6 dB: LNA öncesi kablo/konektör kaybı (~1 dB doğrudan eklenir) + ADC eşdeğer gürültüsü + sıcaklık/üretim payı. Sayılar öğreticidir.</text>
