<svg viewBox="0 0 860 282" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g77">
<title id="t-g77">M-8 direct RF sampling almaç blok şeması: anten → limiter → LNA → Nyquist bandı seçici BPF → zayıflatıcı/AGC → ADC sürücü → çok GSPS RF ADC → NCO ile kompleks mixer → DDC → I/Q; örnekleme saati jitter kritik. Not: frekans planı ADC'ye taşınır, image ve LO sızıntısı yok.</title>
<text x="20.0" y="24.0" text-anchor="start" class="s-baslik">M-8 · Direct RF sampling almaç — mixer yok: LNA'dan sonra doğrudan ADC, kanal seçimi tamamen sayısal</text>
<use href="#sym-anten" x="20.0" y="60.0" width="60" height="40"/>
<text x="50.0" y="113.0" text-anchor="middle" class="s-kucuk">anten</text>
<path d="M80.0 80.0 L112.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-limiter" x="112.0" y="60.0" width="60" height="40"/>
<text x="142.0" y="113.0" text-anchor="middle" class="s-kucuk">limiter</text>
<path d="M172.0 80.0 L204.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-amp" x="204.0" y="60.0" width="60" height="40"/>
<text x="234.0" y="113.0" text-anchor="middle" class="s-kucuk">LNA</text>
<path d="M264.0 80.0 L296.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-bpf" x="296.0" y="60.0" width="60" height="40"/>
<text x="326.0" y="113.0" text-anchor="middle" class="s-kucuk">Nyquist bandı BPF</text>
<text x="326.0" y="125.0" text-anchor="middle" class="s-mono2">bölge seçici</text>
<path d="M356.0 80.0 L388.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-att" x="388.0" y="60.0" width="60" height="40"/>
<text x="418.0" y="113.0" text-anchor="middle" class="s-kucuk">att / AGC</text>
<path d="M448.0 80.0 L480.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-amp" x="480.0" y="60.0" width="60" height="40"/>
<text x="510.0" y="113.0" text-anchor="middle" class="s-kucuk">ADC sürücü</text>
<path d="M540.0 80.0 L572.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="572.0" y="60.0" width="60" height="40"/>
<text x="602.0" y="113.0" text-anchor="middle" class="s-kucuk">RF ADC</text>
<text x="602.0" y="125.0" text-anchor="middle" class="s-mono2">çok GSPS</text>
<path d="M632.0 80.0 L664.0 80.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<use href="#sym-mixer-d" x="664.0" y="60.0" width="60" height="40"/>
<text x="694.0" y="113.0" text-anchor="middle" class="s-kucuk">⊗ NCO</text>
<path d="M724.0 80.0 L756.0 80.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fir" x="756.0" y="60.0" width="60" height="40"/>
<text x="786.0" y="113.0" text-anchor="middle" class="s-kucuk">DDC</text>
<use href="#sym-saat" x="550.0" y="130.0" width="60" height="40"/>
<text x="580.0" y="183.0" text-anchor="middle" class="s-kucuk">örnekleme saati</text>
<text x="580.0" y="195.0" text-anchor="middle" class="s-mono2">jitter kritik</text>
<path d="M580.0 130.0 L580.0 100.0" class="yol-saat" fill="none" marker-end="url(#ok-saat)"/>
<use href="#sym-nco" x="664.0" y="130.0" width="60" height="40"/>
<path d="M694.0 130.0 L694.0 100.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<path d="M816.0 80.0 L846.0 80.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<text x="850.0" y="84.0" text-anchor="start" class="s-mono s-vurgu">I/Q</text>
<rect x="20.0" y="196.0" width="820.0" height="74.0" rx="6" class="blok" opacity=".8"/>
<text x="30.0" y="214.0" text-anchor="start" class="s-kucuk">Frekans planı ortadan kalkmaz, ADC'ye taşınır: hangi Nyquist bölgesi, harmonikler ve interleaving spur'ları nereye katlanır (Bölüm 8, 10). LO faz gürültüsünün yerini saat jitter'ı alır.</text>
<text x="30.0" y="230.0" text-anchor="start" class="s-kucuk">Kazanç: image yok, LO sızıntısı yok, aynı ADC'den çok kanal (birden fazla NCO), anında yeniden ayar. Bedel: ADC'nin dinamik aralığı bütün bantla paylaşılır — güçlü</text>
<text x="30.0" y="246.0" text-anchor="start" class="s-kucuk">tek sinyal tüm bandı doyurur; analog seçicilik yalnızca Nyquist bandı filtresi kadardır. RFSoC sınıfı çipler bu mimariyi tek yongaya sığdırır.</text>
<text x="30.0" y="262.0" text-anchor="start" class="s-kucuk s-altin">Referans senaryodan farkı: mixer ve IF katları yok; 9.4 GHz doğrudan (ör. 5. Nyquist bölgesinden) örneklenir.</text>
</svg>