<svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g130">
<title id="t-g130">Uçtan uca geliştirme akışı: kayan noktalı model → sabit noktalı model → bit-true referans → HDL üretimi (elle RTL / HDL Coder / Model Composer / HLS) → RTL simülasyonu ve bit-exact karşılaştırma → sentez ve timing → donanımda doğrulama; kırmızı geri oklar başarısız kapıdan dönüş, yeşil oklar PS'e açılan parametreler</title>
<!-- ana kutular (y=120) -->
<g>
  <rect x="20" y="110" width="130" height="70" rx="8" class="blok"/>
  <text x="85" y="138" text-anchor="middle" class="s-metin" style="font-weight:700">1 · Kayan nokta</text>
  <text x="85" y="156" text-anchor="middle" class="s-kucuk">MATLAB / Python, double</text>
  <text x="85" y="170" text-anchor="middle" class="s-kucuk">"algoritma doğru mu?"</text>

  <path d="M150 145 H176" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
  <rect x="180" y="110" width="130" height="70" rx="8" class="blok"/>
  <text x="245" y="138" text-anchor="middle" class="s-metin" style="font-weight:700">2 · Sabit nokta</text>
  <text x="245" y="156" text-anchor="middle" class="s-kucuk">bit, Q, yuvarlama, doyurma</text>
  <text x="245" y="170" text-anchor="middle" class="s-kucuk">kayıp ölçülür (dB)</text>

  <path d="M310 145 H336" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
  <rect x="340" y="110" width="130" height="70" rx="8" class="blok-aktif"/>
  <text x="405" y="138" text-anchor="middle" class="s-metin" style="font-weight:700">3 · Bit-true referans</text>
  <text x="405" y="156" text-anchor="middle" class="s-kucuk">donanımın üreteceği bitler</text>
  <text x="405" y="170" text-anchor="middle" class="s-kucuk">→ test vektörü + golden</text>

  <path d="M470 145 H496" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
  <rect x="500" y="60" width="150" height="170" rx="8" class="blok"/>
  <text x="575" y="82" text-anchor="middle" class="s-metin" style="font-weight:700">4 · HDL üretimi</text>
  <rect x="512" y="94" width="126" height="26" rx="4" class="blok"/><text x="575" y="111" text-anchor="middle" class="s-kucuk">elle RTL (VHDL/Verilog)</text>
  <rect x="512" y="126" width="126" height="26" rx="4" class="blok"/><text x="575" y="143" text-anchor="middle" class="s-kucuk">HDL Coder (Simulink)</text>
  <rect x="512" y="158" width="126" height="26" rx="4" class="blok"/><text x="575" y="175" text-anchor="middle" class="s-kucuk">Vitis Model Composer</text>
  <rect x="512" y="190" width="126" height="26" rx="4" class="blok"/><text x="575" y="207" text-anchor="middle" class="s-kucuk">HLS (C/C++, ap_fixed)</text>

  <path d="M650 145 H676" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
  <rect x="680" y="110" width="130" height="70" rx="8" class="blok"/>
  <text x="745" y="138" text-anchor="middle" class="s-metin" style="font-weight:700">5 · RTL simülasyonu</text>
  <text x="745" y="156" text-anchor="middle" class="s-kucuk">test vektörü → RTL</text>
  <text x="745" y="170" text-anchor="middle" class="s-kucuk s-vurgu">bit-exact: fark = 0</text>

  <path d="M810 145 H836" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
  <rect x="840" y="110" width="120" height="70" rx="8" class="blok"/>
  <text x="900" y="138" text-anchor="middle" class="s-metin" style="font-weight:700">6 · Sentez</text>
  <text x="900" y="156" text-anchor="middle" class="s-kucuk">yerleşim, timing</text>
  <text x="900" y="170" text-anchor="middle" class="s-kucuk">kaynak / saat kapanır mı?</text>

  <path d="M960 145 H986" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
  <rect x="990" y="110" width="120" height="70" rx="8" class="blok-aktif"/>
  <text x="1050" y="138" text-anchor="middle" class="s-metin" style="font-weight:700">7 · Donanım</text>
  <text x="1050" y="156" text-anchor="middle" class="s-kucuk">ILA / snapshot / DMA</text>
  <text x="1050" y="170" text-anchor="middle" class="s-kucuk">aynı golden ile karşılaştır</text>
</g>
<!-- kapı etiketleri -->
<text x="85" y="100" text-anchor="middle" class="s-kucuk">kapı: sistem ölçütü</text>
<text x="245" y="100" text-anchor="middle" class="s-kucuk">kapı: kayıp ≤ bütçe</text>
<text x="405" y="100" text-anchor="middle" class="s-kucuk">kapı: model = spesifikasyon</text>
<text x="745" y="100" text-anchor="middle" class="s-kucuk">kapı: bit-exact</text>
<text x="900" y="100" text-anchor="middle" class="s-kucuk">kapı: timing</text>
<text x="1050" y="100" text-anchor="middle" class="s-kucuk">kapı: kartta bit-exact</text>
<!-- geri dönüş okları (kırmızı) -->
<path d="M745 180 V250 H405 V184" fill="none" class="yol-gurultu" marker-end="url(#ok-gurultu)"/>
<text x="575" y="264" text-anchor="middle" class="s-kucuk s-kirmizi">fark ≠ 0 → model mi RTL mi? (en öğretici adım)</text>
<path d="M900 180 V286 H245 V184" fill="none" class="yol-gurultu" marker-end="url(#ok-gurultu)"/>
<text x="575" y="300" text-anchor="middle" class="s-kucuk s-kirmizi">timing / kaynak sığmadı → kelime kısalt, pipeline ekle, SSR artır</text>
<path d="M1050 180 V322 H85 V184" fill="none" class="yol-gurultu" marker-end="url(#ok-gurultu)"/>
<text x="575" y="336" text-anchor="middle" class="s-kucuk s-kirmizi">kartta fark: CDC, reset, JESD, seviye kalibrasyonu → ilgili kapıya dön</text>
<!-- PS register'ları (yeşil) -->
<rect x="340" y="20" width="130" height="30" rx="6" class="blok-kontrol"/>
<text x="405" y="39" text-anchor="middle" class="s-kucuk s-yesil">PS register'ları</text>
<path d="M405 50 V106" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<path d="M470 35 H1030 V106" fill="none" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<text x="700" y="30" text-anchor="middle" class="s-kucuk s-yesil">FTW · eşik · katsayı · mod bitleri → register haritası (modelde de alan, RTL'de de, sürücüde de)</text>
<!-- roller -->
<text x="20" y="372" class="s-kucuk"><tspan class="s-vurgu">Roller:</tspan> 1–3 algoritma mühendisi · 4–6 sayısal tasarımcı · 7 sayısal tasarımcı + gömülü yazılımcı · register haritası üçünün ortak sözleşmesi</text>
<text x="20" y="390" class="s-kucuk">Sözleşmeler: bit-true model + test vektörleri (3 → 4) · register haritası + latency tablosu (6 → yazılım)</text>
</svg>
