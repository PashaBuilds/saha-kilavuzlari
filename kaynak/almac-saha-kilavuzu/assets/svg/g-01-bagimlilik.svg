<svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g01">
<title id="t-g01">Kavram bağımlılık haritası: bölümler arasındaki ön koşul okları; temel düğümler 1, 2, 4, 9, 12, 14, 18, 21</title>
<defs>
  <marker id="g01-ok" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker>
</defs>
<style>
  .g01 line, .g01 path { stroke: var(--ink-3); stroke-width: 1.1; fill: none; marker-end: url(#g01-ok); opacity: .75; }
  .g01 .dn { fill: var(--dia-blok); stroke: var(--line-2); stroke-width: 1.2; }
  .g01 .dn.rf { fill: var(--gold-soft); stroke: var(--gold); }
  .g01 .dn.adc { fill: var(--dia-blok-2); stroke: var(--ink-2); }
  .g01 .dn.dsp { fill: var(--accent-soft); stroke: var(--accent); }
  .g01 .dn.sw { fill: var(--green-soft); stroke: var(--green); }
  .g01 .dn.temel { stroke-width: 2.6; }
  .g01 .no { font-family: var(--mono); font-size: 12px; font-weight: 700; fill: var(--ink); }
  .g01 .ad { font-family: var(--sans); font-size: 10.5px; fill: var(--ink-2); }
</style>
<g class="g01">
