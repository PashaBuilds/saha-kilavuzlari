<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g301">
<title id="t-g301">Açılış sırası akış şeması: saat ağacı → ADC ve JESD link → kalibrasyon yükleme → DDC ayarı → FFT ayarı → gürültü tabanı doğrulaması ve tespit ayarı → PDW akışı → kendi kendini test; her adımda doğrulama koşulu ve başarısızlıkta Bölüm 29 dalı</title>
<style>
  .a .adim { fill: var(--dia-blok); stroke: var(--line-2); stroke-width: 1.2; }
  .a .kosul { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
  .a .hata { fill: var(--red-soft); stroke: var(--red); stroke-width: 1.1; }
  .a .son { fill: var(--green-soft); stroke: var(--green); stroke-width: 1.2; }
  .a .t { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
  .a .t2 { font-family: var(--sans); font-size: 10.5px; fill: var(--ink-2); }
  .a .b { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
  .a .no { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--accent); }
  .a path, .a line { stroke: var(--ink-3); stroke-width: 1.2; fill: none; marker-end: url(#ok-ince); }
  .a .h { stroke: var(--red); }
</style>
<g class="a">
<!-- sol sütun adımlar -->
<g>
  <rect class="adim" x="40" y="20" width="250" height="44" rx="6"/><text class="no" x="52" y="38">1</text><text class="t" x="70" y="38">Saat ağacı</text><text class="t2" x="70" y="54">referans seç, PLL programla</text>
  <rect class="kosul" x="330" y="24" width="220" height="36" rx="18"/><text class="t2" x="440" y="46" text-anchor="middle">CLK_STATUS bit0 &amp; bit3 = 1 (zaman aşımı ile)</text>
  <rect class="hata" x="600" y="24" width="270" height="36" rx="6"/><text class="t2" x="735" y="41" text-anchor="middle">→ B29 sol kol: referans / PLL / SYSREF</text><text class="b" x="735" y="54" text-anchor="middle">devam etme</text>
</g>
<g transform="translate(0,58)">
  <rect class="adim" x="40" y="20" width="250" height="44" rx="6"/><text class="no" x="52" y="38">2</text><text class="t" x="70" y="38">ADC ve arayüz</text><text class="t2" x="70" y="54">ADC yapılandır, SYSREF, JESD link</text>
  <rect class="kosul" x="330" y="24" width="220" height="36" rx="18"/><text class="t2" x="440" y="46" text-anchor="middle">link up · rampa deseni ardışık</text>
  <rect class="hata" x="600" y="24" width="270" height="36" rx="6"/><text class="t2" x="735" y="46" text-anchor="middle">→ B29: lane sırası / veri biçimi / test deseni</text>
</g>
<g transform="translate(0,116)">
  <rect class="adim" x="40" y="20" width="250" height="44" rx="6"/><text class="no" x="52" y="38">3</text><text class="t" x="70" y="38">Kalibrasyon yükle</text><text class="t2" x="70" y="54">tablolar + sıcaklık → CAL_*</text>
  <rect class="kosul" x="330" y="24" width="220" height="36" rx="18"/><text class="t2" x="440" y="46" text-anchor="middle">tablo sürümü / CRC doğru</text>
</g>
<g transform="translate(0,174)">
  <rect class="adim" x="40" y="20" width="250" height="44" rx="6"/><text class="no" x="52" y="38">4</text><text class="t" x="70" y="38">DDC</text><text class="t2" x="70" y="54">FTW, POW, inversion, mod, katsayı + COMMIT, senkron reset</text>
  <rect class="kosul" x="330" y="24" width="220" height="36" rx="18"/><text class="t2" x="440" y="46" text-anchor="middle">geri okuma = yazılan</text>
</g>
<g transform="translate(0,232)">
  <rect class="adim" x="40" y="20" width="250" height="44" rx="6"/><text class="no" x="52" y="38">5</text><text class="t" x="70" y="38">Frekans kolu</text><text class="t2" x="70" y="54">FFT_CTRL (pencere, N), FFT_SCALE</text>
</g>
<g transform="translate(0,290)">
  <rect class="adim" x="40" y="20" width="250" height="44" rx="6"/><text class="no" x="52" y="38">6</text><text class="t" x="70" y="38">Tespit</text><text class="t2" x="70" y="54">önce sabit eşik yüksek, CFAR kapalı</text>
  <rect class="kosul" x="330" y="24" width="220" height="36" rx="18"/><text class="t2" x="440" y="46" text-anchor="middle">NOISE_EST ≈ beklenen taban (±3 dB)</text>
  <rect class="hata" x="600" y="24" width="270" height="36" rx="6"/><text class="t2" x="735" y="46" text-anchor="middle">→ B29 orta kol: kazanç / saat / doyum</text>
</g>
<g transform="translate(0,348)">
  <rect class="adim" x="40" y="20" width="250" height="44" rx="6"/><text class="no" x="52" y="38">7</text><text class="t" x="70" y="38">PDW akışı</text><text class="t2" x="70" y="54">DMA halka, IRQ_MASK, FIFO etkin</text>
  <rect class="kosul" x="330" y="24" width="220" height="36" rx="18"/><text class="t2" x="440" y="46" text-anchor="middle">ilk 100 PDW: sıra no ardışık, DROP_CNT = 0</text>
</g>
<g transform="translate(0,406)">
  <rect class="son" x="40" y="20" width="250" height="40" rx="6"/><text class="no" x="52" y="38">8</text><text class="t" x="70" y="38">Kendi kendini test: CW → PDW</text><text class="t2" x="70" y="52">RF ve PA beklenen ± tolerans</text>
  <rect class="son" x="330" y="24" width="220" height="32" rx="16"/><text class="t2" x="440" y="44" text-anchor="middle">HAZIR — anten girişine geç</text>
</g>
<!-- dikey akış okları -->
<line x1="165" y1="64" x2="165" y2="78"/><line x1="165" y1="122" x2="165" y2="136"/><line x1="165" y1="180" x2="165" y2="194"/>
<line x1="165" y1="238" x2="165" y2="252"/><line x1="165" y1="296" x2="165" y2="310"/><line x1="165" y1="354" x2="165" y2="368"/><line x1="165" y1="412" x2="165" y2="426"/>
<!-- koşul okları -->
<line x1="290" y1="42" x2="330" y2="42"/><line x1="550" y1="42" x2="600" y2="42" class="h"/>
<line x1="290" y1="100" x2="330" y2="100"/><line x1="550" y1="100" x2="600" y2="100" class="h"/>
<line x1="290" y1="158" x2="330" y2="158"/><line x1="290" y1="216" x2="330" y2="216"/>
<line x1="290" y1="332" x2="330" y2="332"/><line x1="550" y1="332" x2="600" y2="332" class="h"/>
<line x1="290" y1="390" x2="330" y2="390"/><line x1="290" y1="446" x2="330" y2="446"/>
<text class="b" x="600" y="200">yeşil hap: doğrulama koşulu · kırmızı kutu: başarısızlıkta gidilecek dal</text>
<text class="b" x="600" y="216">koşulu atlayıp devam eden açılış, sonraki adımlarda yanıltıcı belirti üretir</text>
</g>
</svg>
