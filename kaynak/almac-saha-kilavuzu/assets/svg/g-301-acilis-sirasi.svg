<svg viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g301">
<title id="t-g301">Açılış sırası akış şeması: saat ağacı → ADC ve JESD link → kalibrasyon yükleme → DDC ayarı → FFT ayarı → gürültü tabanı doğrulaması ve tespit ayarı → PDW akışı → kendi kendini test; her adımda doğrulama koşulu ve başarısızlıkta Bölüm 29 dalı</title>
<style>
  .a .adim { fill: var(--dia-blok); stroke: var(--line-2); stroke-width: 1.2; }
  .a .kosul { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
  .a .hata { fill: var(--red-soft); stroke: var(--red); stroke-width: 1.1; }
  .a .son { fill: var(--green-soft); stroke: var(--green); stroke-width: 1.2; }
  .a .t { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
  .a .t2 { font-family: var(--sans); font-size: 10.5px; fill: var(--ink-2); }
  .a .b { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
  .a .no { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--accent); }
  .a path, .a line { stroke: var(--ink-3); stroke-width: 1.2; fill: none; marker-end: url(#ok-ince); }
  .a .h { stroke: var(--red); }
</style>
<g class="a">
<!-- sol sütun adımlar -->
<g>
  <rect class="adim" x="40" y="20" width="250" height="44" rx="6"/><text class="no" x="52" y="38">1</text><text class="t" x="70" y="38">Saat ağacı</text>
  <text class="t2" x="70" y="54">referans seç, PLL programla</text>
  <rect class="kosul" x="330" y="24" width="220" height="36" rx="18"/><text class="t2" x="440" y="46" text-anchor="middle">CLK_STATUS bit0 &amp; bit3 = 1 (zaman aşımı ile)</text>
  <rect class="hata" x="600" y="24" width="270" height="36" rx="6"/>
  <text class="t2" x="735" y="41" text-anchor="middle">→ B29 sol kol: referans / PLL / SYSREF</text><text class="b" x="735" y="54" text-anchor="middle">devam etme</text>
</g>
<g>
  <rect class="adim" x="40" y="78" width="250" height="44" rx="6"/><text class="no" x="52" y="96">2</text><text class="t" x="70" y="96">ADC ve arayüz</text>
  <text class="t2" x="70" y="112">ADC yapılandır, SYSREF, JESD link</text>
  <rect class="kosul" x="330" y="82" width="220" height="36" rx="18"/><text class="t2" x="440" y="104" text-anchor="middle">link up · rampa deseni ardışık</text>
  <rect class="hata" x="600" y="82" width="270" height="36" rx="6"/>
  <text class="t2" x="735" y="104" text-anchor="middle">→ B29: lane sırası / veri biçimi / test deseni</text>
</g>
<g>
  <rect class="adim" x="40" y="136" width="250" height="44" rx="6"/><text class="no" x="52" y="154">3</text><text class="t" x="70" y="154">Kalibrasyon yükle</text>
  <text class="t2" x="70" y="170">tablolar + sıcaklık → CAL_*</text>
  <rect class="kosul" x="330" y="140" width="220" height="36" rx="18"/><text class="t2" x="440" y="162" text-anchor="middle">tablo sürümü / CRC doğru</text>
</g>
<g>
  <rect class="adim" x="40" y="194" width="250" height="56" rx="6"/><text class="no" x="52" y="212">4</text><text class="t" x="70" y="212">DDC</text>
  <text class="t2" x="70" y="226">FTW, POW, inversion, mod, katsayı + COMMIT,</text><text class="t2" x="70" y="239">senkron reset</text>
  <rect class="kosul" x="330" y="198" width="220" height="36" rx="18"/><text class="t2" x="440" y="220" text-anchor="middle">geri okuma = yazılan</text>
</g>
<g>
  <rect class="adim" x="40" y="264" width="250" height="44" rx="6"/><text class="no" x="52" y="282">5</text><text class="t" x="70" y="282">Frekans kolu</text>
  <text class="t2" x="70" y="298">FFT_CTRL (pencere, N), FFT_SCALE</text>
</g>
<g>
  <rect class="adim" x="40" y="322" width="250" height="44" rx="6"/><text class="no" x="52" y="340">6</text><text class="t" x="70" y="340">Tespit</text>
  <text class="t2" x="70" y="356">önce sabit eşik yüksek, CFAR kapalı</text>
  <rect class="kosul" x="330" y="326" width="220" height="36" rx="18"/><text class="t2" x="440" y="348" text-anchor="middle">NOISE_EST ≈ beklenen taban (±3 dB)</text>
  <rect class="hata" x="600" y="326" width="270" height="36" rx="6"/>
  <text class="t2" x="735" y="348" text-anchor="middle">→ B29 orta kol: kazanç / saat / doyum</text>
</g>
<g>
  <rect class="adim" x="40" y="380" width="250" height="44" rx="6"/><text class="no" x="52" y="398">7</text><text class="t" x="70" y="398">PDW akışı</text>
  <text class="t2" x="70" y="414">DMA ring buffer, IRQ_MASK, FIFO etkin</text>
  <rect class="kosul" x="330" y="384" width="220" height="36" rx="18"/><text class="t2" x="440" y="406" text-anchor="middle">ilk 100 PDW: sıra no ardışık, DROP_CNT = 0</text>
</g>
<g>
  <rect class="son" x="40" y="438" width="250" height="40" rx="6"/><text class="no" x="52" y="456">8</text><text class="t" x="70" y="456">Self-test: CW → PDW</text>
  <text class="t2" x="70" y="470">RF ve PA beklenen ± tolerans</text>
  <rect class="son" x="330" y="444" width="220" height="32" rx="16"/><text class="t2" x="440" y="464" text-anchor="middle">HAZIR — anten girişine geç</text>
</g>
<!-- dikey akış okları -->
<line x1="165" y1="64" x2="165" y2="78"/>
<line x1="165" y1="122" x2="165" y2="136"/>
<line x1="165" y1="180" x2="165" y2="194"/>
<line x1="165" y1="250" x2="165" y2="264"/>
<line x1="165" y1="308" x2="165" y2="322"/>
<line x1="165" y1="366" x2="165" y2="380"/>
<line x1="165" y1="424" x2="165" y2="438"/>
<!-- koşul okları -->
<line x1="290" y1="42" x2="330" y2="42"/>
<line x1="550" y1="42" x2="600" y2="42" class="h"/>
<line x1="290" y1="100" x2="330" y2="100"/>
<line x1="550" y1="100" x2="600" y2="100" class="h"/>
<line x1="290" y1="158" x2="330" y2="158"/>
<line x1="290" y1="216" x2="330" y2="216"/>
<line x1="290" y1="344" x2="330" y2="344"/>
<line x1="550" y1="344" x2="600" y2="344" class="h"/>
<line x1="290" y1="402" x2="330" y2="402"/>
<line x1="290" y1="460" x2="330" y2="460"/>
<text class="b" x="330" y="282">yeşil hap: doğrulama koşulu · kırmızı kutu: başarısızlıkta gidilecek dal</text>
<text class="b" x="330" y="298">koşulu atlayıp devam eden açılış, sonraki adımlarda yanıltıcı belirti üretir</text>
</g>
</svg>
