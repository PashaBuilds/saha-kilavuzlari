<svg viewBox="0 0 860 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g76">
<title id="t-g76">M-7 sayısal IF almaç blok şeması: anten → limiter → LNA → preselector → mixer (LO 7.6 GHz) → IF filtre 1.8 GHz → IF yükselteç → anti-alias → ADC 2.4 GSPS; sayısal tarafta NCO ile kompleks mixer → FIR/CIC → decimation ↓8 → zarf → CFAR → PDW FIFO; PS register'ları yeşil.</title>
