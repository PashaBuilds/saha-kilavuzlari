<text x="250.0" y="265.0" text-anchor="start" class="s-kucuk">Analog–sayısal sınır IF'te: ADC'den sonrası FPGA. Frekans doğruluğu NCO/FFT'den, kanal seçiciliği sayısal filtreden gelir; bant ADC'nin Nyquist bölgesi kadar.</text>
