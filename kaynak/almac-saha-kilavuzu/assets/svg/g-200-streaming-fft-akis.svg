<svg viewBox="0 0 1160 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g200">
<title id="t-g200">FPGA'da streaming FFT veri akışı: DDC çıkışı 300 MSPS 16+16 bit I/Q → overlap tamponu (ping-pong BRAM, her 512 örnekte yeni 1024'lük çerçeve) → pencere çarpımı (Hann katsayı ROM'u, 512 giriş simetrik, tek DSP) → pipelined FFT çekirdeği (N = 1024, radix-2², ölçekleme takvimi register'dan, blok kayan nokta seçeneği) → bin ters çevirme (bit-reversed → doğal sıra) ve fftshift → |X|² = I² + Q² (36 bit → 20 bit dB/log2 LUT) → tepe bul / eşik → FIFO → PS. Kontrol register'ları yeşil: WIN_SEL, FFT_SCALE_SCH, FFT_NFFT, FFT_THR. Zamanlama: çerçeve süresi 3.41 µs, adım 1.71 µs, çekirdek gecikmesi ≈ N + pipeline saat.</title>
<rect x="20" y="120" width="120" height="70" rx="7" class="blok-aktif"/>
<text x="80" y="160" text-anchor="middle" class="s-metin">DDC çıkışı</text>
<text x="80" y="212" text-anchor="middle" class="s-mono2">I/Q 16+16 bit</text>
<text x="80" y="227" text-anchor="middle" class="s-kucuk">300 MSPS</text>
<path d="M140 155 H148" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="150" y="120" width="120" height="70" rx="7" class="blok"/>
<text x="210" y="160" text-anchor="middle" class="s-metin">overlap tamponu</text>
<text x="210" y="212" text-anchor="middle" class="s-mono2">ping-pong BRAM</text>
<text x="210" y="227" text-anchor="middle" class="s-kucuk">2 × 1024 × 32 bit</text>
<path d="M270 155 H298" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fir" x="315" y="116" width="90" height="60"/>
<text x="360" y="188" text-anchor="middle" class="s-metin">× pencere</text>
<text x="360" y="212" text-anchor="middle" class="s-mono2">Hann ROM 512×16</text>
<text x="360" y="227" text-anchor="middle" class="s-kucuk">1 DSP, simetri</text>
<path d="M420 155 H448" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fft" x="465" y="116" width="90" height="60"/>
<text x="510" y="188" text-anchor="middle" class="s-metin">FFT çekirdeği</text>
<text x="510" y="212" text-anchor="middle" class="s-mono2">pipelined N=1024</text>
<text x="510" y="227" text-anchor="middle" class="s-kucuk">radix-2², 10 kademe</text>
<path d="M570 155 H598" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="600" y="120" width="120" height="70" rx="7" class="blok"/>
<text x="660" y="160" text-anchor="middle" class="s-metin">sıra + shift</text>
<text x="660" y="212" text-anchor="middle" class="s-mono2">bit-reversed→doğal</text>
<text x="660" y="227" text-anchor="middle" class="s-kucuk">fftshift (k+N/2)</text>
<path d="M720 155 H738" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-zarf" x="755" y="116" width="90" height="60"/>
<text x="800" y="188" text-anchor="middle" class="s-metin">|X|²</text>
<text x="800" y="212" text-anchor="middle" class="s-mono2">I²+Q² → 36 bit</text>
<text x="800" y="227" text-anchor="middle" class="s-kucuk">log2 LUT → 20 bit dB</text>
<path d="M860 155 H878" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-cmp" x="895" y="116" width="90" height="60"/>
<text x="940" y="188" text-anchor="middle" class="s-metin">tepe / eşik</text>
<text x="940" y="212" text-anchor="middle" class="s-mono2">en büyük bin + komşu</text>
<text x="940" y="227" text-anchor="middle" class="s-kucuk">eşik üstü bin listesi</text>
<path d="M1000 155 H1018" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fifo" x="1035" y="116" width="90" height="60"/>
<text x="1080" y="188" text-anchor="middle" class="s-metin">FIFO → PS</text>
<text x="1080" y="212" text-anchor="middle" class="s-mono2">AXI-Stream / DMA</text>
<text x="1080" y="227" text-anchor="middle" class="s-kucuk">bin no, dB, çerçeve no</text>
<text x="145" y="148" text-anchor="middle" class="s-kucuk s-vurgu">32 b</text>
<text x="285" y="148" text-anchor="middle" class="s-kucuk s-vurgu">32 b</text>
<text x="435" y="148" text-anchor="middle" class="s-kucuk s-vurgu">32 b</text>
<text x="585" y="148" text-anchor="middle" class="s-kucuk s-vurgu">2×(16+10) b</text>
<text x="730" y="148" text-anchor="middle" class="s-kucuk s-vurgu">26+26 b</text>
<text x="870" y="148" text-anchor="middle" class="s-kucuk s-vurgu">20 b dB</text>
<text x="1010" y="148" text-anchor="middle" class="s-kucuk s-vurgu">16 b × k</text>
<rect x="290" y="250" width="150" height="26" rx="4" class="blok-kontrol"/>
<text x="365" y="267" text-anchor="middle" class="s-mono">WIN_SEL</text>
<text x="365" y="292" text-anchor="middle" class="s-kucuk s-yesil">0 dikd. · 1 Hann · 2 BH · 3 Kaiser</text>
<path d="M360 250 V192" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<rect x="450" y="250" width="150" height="26" rx="4" class="blok-kontrol"/>
<text x="525" y="267" text-anchor="middle" class="s-mono">FFT_SCALE_SCH</text>
<text x="525" y="292" text-anchor="middle" class="s-kucuk s-yesil">kademe çifti başına 2 bit: 0x2AA</text>
<path d="M510 250 V192" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<rect x="620" y="250" width="150" height="26" rx="4" class="blok-kontrol"/>
<text x="695" y="267" text-anchor="middle" class="s-mono">FFT_LOG2N</text>
<text x="695" y="292" text-anchor="middle" class="s-kucuk s-yesil">log2 N = 10</text>
<path d="M510 250 V192" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<rect x="860" y="250" width="150" height="26" rx="4" class="blok-kontrol"/>
<text x="935" y="267" text-anchor="middle" class="s-mono">FFT_THR</text>
<text x="935" y="292" text-anchor="middle" class="s-kucuk s-yesil">eşik, dB (Q8.4)</text>
<path d="M940 250 V192" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<text x="20" y="267" class="s-kucuk">PS (AXI-Lite) register'ları →</text>
<text x="20" y="350" class="s-baslik">Zamanlama (300 MHz örnek saati, SSR yok)</text>
<text x="20" y="370" class="s-metin2">çerçeve N = 1024 örnek = 3.41 µs · %50 overlap → her 512 örnek (1.71 µs) yeni çerçeve → 586 k çerçeve/s</text>
<text x="20" y="388" class="s-metin2">pipelined çekirdek: sürekli akış, giriş hızı = çıkış hızı; gecikme ≈ N + ~150 saat ≈ 3.9 µs · burst çekirdek: 1024 giriş + ~N·log₂N/2 hesap saati, %50 overlap'e yetişemez</text>
<text x="20" y="406" class="s-metin2">çıkış bant genişliği: 586 k × 1024 bin × 20 bit ≈ 12 Gbps → PS'e ham spektrum değil tepe listesi / eşik üstü bin'ler gider (Bölüm 23, 26)</text>
</svg>