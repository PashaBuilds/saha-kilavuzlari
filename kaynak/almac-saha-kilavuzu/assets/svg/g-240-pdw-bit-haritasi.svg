<title id="t-g240">Kurgusal 128-bit PDW bit alan haritası: dört 32-bit sözcük; W0 TOA alt 32 bit; W1 TOA üst 16 bit, PA 10 bit, bayraklar 6 bit; W2 PW 20 bit, AOA 12 bit; W3 RF 20 bit, sıra numarası 8 bit, MOP tipi 2 bit, kanal 2 bit</title>
