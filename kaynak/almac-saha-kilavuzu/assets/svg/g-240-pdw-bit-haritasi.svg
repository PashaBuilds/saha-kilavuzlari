<text x="70.0" y="317.0" text-anchor="start" class="s-kucuk">Meta alanlar (yeşil) 18 bit: FLAGS[5:0] = SEG · POP · CLIP · SAT · AOA_INV · EXT   ·   SEQ 8 b (mod 256)   ·   MOP 2 b (0 yok, 1 LFM, 2 faz kodlu, 3 bilinmiyor)   ·   CH 2 b</text>
