<text x="62" y="372" class="s-kucuk">Okuma: f_in 2× → −6 dB; σ 2× → −6 dB. 14 bitin 86 dB'sini 1.8 GHz'te görmek için σ ≈ 4.4 fs gerekir — pratikte erişilmez; jitter GHz girişte baskın terimdir.</text>
