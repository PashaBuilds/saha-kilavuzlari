<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g92">
<title id="t-g92">Aperture jitter SNR eğri ailesi: yatay eksen giriş frekansı 100 MHz–10 GHz (logaritmik), düşey eksen SNR tavanı; σ = 50, 100, 200, 500 fs için −20·log10(2π·f·σ) doğruları (frekans iki katına çıkınca 6 dB düşer); yatay çizgiler 14 ve 12 bit ideal kuantizasyon SNR'ı (86.0 ve 74.0 dB); referans senaryo çalışma noktası 1.8 GHz IF, 100 fs → 58.9 dB; direct RF örneklemede 9.4 GHz, 100 fs → 44.6 dB</title>
<text x="62" y="22" class="s-baslik">Jitter SNR tavanı: SNR_j = −20·log10(2π · f_in · σ_j)</text>
