<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g233">
<title id="t-g233">CA-CFAR donanım blok şeması: güç girişi 21 hücrelik gecikme hattına girer; ardıl ve öncü referans pencereleri için iki kayan toplam (yeni hücre eklenir, pencereden çıkan çıkarılır), toplamları Σ; Σ, PS'in yazdığı α register'ı (Q6.10) ile çarpılır; test hücresi N ile (kaydırma) çarpılır ve bölmesiz karşılaştırma x_CUT·N &gt; α·Σ tespit bayrağını üretir; sağda tespit sayacı ve PS register'ları yeşil</title>
<!-- giriş -->
<text x="14" y="52" class="s-kucuk">güç x[n]</text>
<text x="14" y="64" class="s-mono2">20 bit · 300 MSPS</text>
<path d="M14 80 H70" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<!-- gecikme hattı -->
<rect x="70" y="58" width="546" height="44" rx="5" class="blok"/>
<text x="343" y="50" text-anchor="middle" class="s-metin2">gecikme hattı (shift register, N + 2G + 1 = 21 hücre × 20 bit; SRL/BRAM)</text>
<!-- hücre bölmeleri: 21 hücre × 26 px -->
<g stroke="var(--line-2)" stroke-width="1">
<path d="M96 58 V102 M122 58 V102 M148 58 V102 M174 58 V102 M200 58 V102 M226 58 V102 M252 58 V102 M278 58 V102 M304 58 V102 M330 58 V102 M356 58 V102 M382 58 V102 M408 58 V102 M434 58 V102 M460 58 V102 M486 58 V102 M512 58 V102 M538 58 V102 M564 58 V102 M590 58 V102"/>
</g>
<rect x="70" y="58" width="208" height="44" rx="5" fill="var(--accent)" opacity=".12"/>
<rect x="278" y="58" width="52" height="44" fill="var(--ink-3)" opacity=".15"/>
<rect x="330" y="58" width="26" height="44" fill="var(--gold)" opacity=".35"/>
<rect x="356" y="58" width="52" height="44" fill="var(--ink-3)" opacity=".15"/>
<rect x="408" y="58" width="208" height="44" rx="5" fill="var(--accent)" opacity=".12"/>
<text x="174" y="84" text-anchor="middle" class="s-kucuk">ardıl referans x[n]…x[n−7]</text>
<text x="304" y="84" text-anchor="middle" class="s-kucuk">G</text>
<text x="343" y="84" text-anchor="middle" class="s-kucuk" style="font-weight:700">CUT</text>
<text x="382" y="84" text-anchor="middle" class="s-kucuk">G</text>
<text x="512" y="84" text-anchor="middle" class="s-kucuk">öncü referans x[n−13]…x[n−20]</text>
<text x="343" y="116" text-anchor="middle" class="s-mono2">x[n−10]</text>
<!-- kayan toplam: ardıl -->
<path d="M70 102 V150 H150" class="yol-sayisal" fill="none"/>
<text x="76" y="140" class="s-kucuk s-vurgu">+ x[n] (yeni)</text>
<path d="M278 102 V150 H198" class="yol-sayisal" fill="none"/>
<text x="206" y="140" class="s-kucuk s-kirmizi">− x[n−8] (çıkan)</text>
<use href="#sym-topla" x="144" y="130" width="60" height="40"/>
<rect x="132" y="176" width="84" height="26" rx="4" class="blok-aktif"/>
<text x="174" y="193" text-anchor="middle" class="s-mono">Σ_ardıl 24b</text>
<path d="M174 170 V176" class="yol-sayisal"/>
<path d="M216 189 H236 V150 H204" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<text x="240" y="186" class="s-kucuk">geri besleme</text>
<!-- kayan toplam: öncü -->
<path d="M408 102 V150 H488" class="yol-sayisal" fill="none"/>
<text x="412" y="140" class="s-kucuk s-vurgu">+ x[n−13]</text>
<path d="M616 102 V150 H536" class="yol-sayisal" fill="none"/>
<text x="546" y="140" class="s-kucuk s-kirmizi">− x[n−21]</text>
<use href="#sym-topla" x="482" y="130" width="60" height="40"/>
<rect x="470" y="176" width="84" height="26" rx="4" class="blok-aktif"/>
<text x="512" y="193" text-anchor="middle" class="s-mono">Σ_öncü 24b</text>
<path d="M512 170 V176" class="yol-sayisal"/>
<path d="M554 189 H574 V150 H542" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<!-- Σ toplam -->
<path d="M174 202 V236 H313" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<path d="M512 202 V236 H373" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<use href="#sym-topla" x="313" y="216" width="60" height="40"/>
<text x="343" y="270" text-anchor="middle" class="s-mono2">Σ = 16 hücre toplamı (25 bit)</text>
<!-- α çarpımı -->
<path d="M373 236 H430" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="430" y="218" width="74" height="36" rx="5" class="blok"/>
<text x="467" y="235" text-anchor="middle" class="s-metin" style="font-weight:700">× α</text>
<text x="467" y="248" text-anchor="middle" class="s-mono2">DSP slice</text>
<text x="467" y="282" text-anchor="middle" class="s-mono2">α·Σ : 25 + 16 → 41 bit (yuvarla)</text>
<!-- α register -->
<rect x="418" y="306" width="98" height="26" rx="4" class="blok-kontrol"/>
<text x="467" y="323" text-anchor="middle" class="s-mono">CFAR_ALPHA</text>
<text x="467" y="348" text-anchor="middle" class="s-kucuk s-yesil">Q6.10 · 21.94 → 0x57C5</text>
<path d="M467 306 V254" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<!-- CUT × N -->
<path d="M343 102 V122" class="yol-sayisal" fill="none"/>
<path d="M343 122 H690 V150" class="yol-analog" fill="none" stroke="var(--gold)" marker-end="url(#ok-analog)"/>
<rect x="650" y="150" width="80" height="34" rx="5" class="blok"/>
<text x="690" y="166" text-anchor="middle" class="s-metin" style="font-weight:700">≪ log₂N</text>
<text x="690" y="179" text-anchor="middle" class="s-mono2">x_CUT · 16</text>
<text x="700" y="116" class="s-kucuk s-altin">test hücresi (gecikmiş güç)</text>
<!-- karşılaştırıcı -->
<path d="M690 184 V208 H750" class="yol-sayisal" fill="none"/>
<path d="M504 236 H750" class="yol-sayisal" fill="none"/>
<use href="#sym-cmp" x="750" y="200" width="60" height="40"/>
<text x="780" y="256" text-anchor="middle" class="s-kucuk">x_CUT·N &gt; α·Σ</text>
<text x="780" y="268" text-anchor="middle" class="s-kucuk">(bölme yok)</text>
<!-- çıkış -->
<path d="M810 220 H870" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="870" y="200" width="116" height="40" rx="5" class="blok-aktif"/>
<text x="928" y="217" text-anchor="middle" class="s-metin">tespit bayrağı</text>
<text x="928" y="232" text-anchor="middle" class="s-mono2">1 bit + güç 20 bit</text>
<text x="928" y="258" text-anchor="middle" class="s-kucuk">→ histerezis / darbe FSM</text>
<!-- sayaç -->
<path d="M840 220 V290 H870" class="yol-kontrol" fill="none" marker-end="url(#ok-kontrol)"/>
<rect x="870" y="276" width="116" height="28" rx="4" class="blok-kontrol"/>
<text x="928" y="294" text-anchor="middle" class="s-mono">CFAR_DET_CNT</text>
<text x="928" y="320" text-anchor="middle" class="s-kucuk s-yesil">giriş sonlandırılınca:</text>
<text x="928" y="332" text-anchor="middle" class="s-kucuk s-yesil">yanlış alarm sayacı</text>
<!-- diğer register'lar -->
<rect x="640" y="306" width="80" height="26" rx="4" class="blok-kontrol"/>
<text x="680" y="323" text-anchor="middle" class="s-mono">CFAR_N</text>
<rect x="730" y="306" width="80" height="26" rx="4" class="blok-kontrol"/>
<text x="770" y="323" text-anchor="middle" class="s-mono">CFAR_G</text>
<text x="740" y="352" text-anchor="middle" class="s-kucuk s-yesil">tap seçimi (mux) · yalnızca 2ⁿ değerler</text>
<use href="#sym-cpu" x="560" y="300" width="60" height="40"/>
<text x="590" y="352" text-anchor="middle" class="s-kucuk">PS (AXI-Lite)</text>
<path d="M620 320 H640" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<!-- saat / gecikme notu -->
<text x="14" y="300" class="s-kucuk">Gecikme: pencere yarısı 10 hücre + pipeline ≈ 4 saat →</text>
<text x="14" y="314" class="s-kucuk">bayrak gücün 14 hücre gerisinden gelir; TOA bu sabitle düzeltilir.</text>
<text x="14" y="328" class="s-kucuk">Kaynak: ~1 SRL/BRAM, 3 toplayıcı, 1 DSP slice, 1 karşılaştırıcı.</text>
<text x="14" y="366" class="s-kucuk">Renk dili: sayısal veri mavi, test hücresi altın, PS register'ları yeşil.</text>
</svg>
