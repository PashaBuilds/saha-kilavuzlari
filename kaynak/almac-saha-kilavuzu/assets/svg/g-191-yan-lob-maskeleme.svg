<text x="504.2" y="174.0" class="s-kucuk s-kirmizi">bu bin'de okunan: -33 dBFS — sızıntı, ton değil</text>
<text x="822" y="56" text-anchor="end" class="s-kucuk">yan lob zarfı ≈ 20·log10(1/(π·δ)) → δ = 12 bin'de ≈ −31 dB; −70 dBFS ton 40 dB altında kalır</text>
<text x="830" y="248" text-anchor="end" class="s-kucuk">frekans (MHz) · dBFS · bant içi gürültü −110 dBFS</text>
