<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g191">
<title id="t-g191">Yan lobun zayıf sinyali maskelemesi (hesaplanmış, N = 1024, fs = 300 MSPS). İki ton: 0 dBFS güçlü ton 10.04 MHz'de (bin 34.27) ve −70 dBFS zayıf ton 13.50 MHz'de (11.8 bin ötede). Üstte dikdörtgen pencere: güçlü tonun yan lobları 12 bin ötede hâlâ ≈ −32 dB'dedir ve zayıf ton bu zarfın altında kaybolur. Altta Blackman-Harris: yan loblar −92 dB'nin altına iner, zayıf ton −70 dBFS'te açıkça görünür; bedeli 2 bin genişliğinde ana lob ve gürültü tabanının 3 dB yükselmesi.</title>
<text x="60" y="28" class="s-baslik">Dikdörtgen pencere — zayıf ton yan lob zarfının altında</text>
