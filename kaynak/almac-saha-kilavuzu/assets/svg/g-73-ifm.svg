<svg viewBox="0 0 860 246" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g73">
<title id="t-g73">M-4 IFM blok şeması: anten → limiter/yükselteç → ikiye böl → gecikme hattı τ ve gecikmesiz kol → faz korelatörü (cos φ, sin φ) → iki ADC → atan2 tablosu → frekans. Not: tek darbede frekans, eşzamanlı sinyal zayıflığı.</title>
<text x="20.0" y="24.0" text-anchor="start" class="s-baslik">M-4 · IFM (anlık frekans ölçer) — gecikme hattı diskriminatörü: faz farkı → frekans</text>
<use href="#sym-anten" x="20.0" y="60.0" width="60" height="40"/>
<text x="50.0" y="113.0" text-anchor="middle" class="s-kucuk">anten</text>
<path d="M80.0 80.0 L120.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-limiter" x="120.0" y="60.0" width="60" height="40"/>
<text x="150.0" y="113.0" text-anchor="middle" class="s-kucuk">limiter / amp</text>
<text x="150.0" y="125.0" text-anchor="middle" class="s-mono2">sabit genlik</text>
<path d="M180.0 80.0 L230.0 80.0" class="yol-analog" fill="none"/>
<path d="M230.0 80.0 L230.0 40.0" class="yol-analog" fill="none"/>
<path d="M230.0 80.0 L230.0 130.0" class="yol-analog" fill="none"/>
<path d="M230.0 40.0 L300.0 40.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<path d="M230.0 130.0 L300.0 130.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-gecikme" x="300.0" y="110.0" width="60" height="40"/>
<text x="330.0" y="163.0" text-anchor="middle" class="s-kucuk">gecikme hattı τ</text>
<text x="330.0" y="175.0" text-anchor="middle" class="s-mono2">faz = 2π·f·τ</text>
<rect x="300.0" y="22.0" width="60.0" height="36.0" rx="4" class="blok-analog"/>
<text x="330.0" y="44.0" text-anchor="middle" class="s-mono2">τ = 0</text>
<path d="M360 40 L420 66" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<path d="M360 130 L420 104" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<rect x="420.0" y="50.0" width="100.0" height="70.0" rx="6" class="blok-analog"/>
<text x="470.0" y="78.0" text-anchor="middle" class="s-metin">faz korelatörü</text>
<text x="470.0" y="96.0" text-anchor="middle" class="s-mono2">cos φ, sin φ</text>
<path d="M520.0 60.0 L570.0 60.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="570.0" y="40.0" width="60" height="40"/>
<text x="600.0" y="93.0" text-anchor="middle" class="s-kucuk">ADC (cos φ)</text>
<path d="M630.0 60.0 L670.0 60.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<path d="M520.0 110.0 L570.0 110.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="570.0" y="90.0" width="60" height="40"/>
<text x="600.0" y="143.0" text-anchor="middle" class="s-kucuk">ADC (sin φ)</text>
<path d="M630.0 110.0 L670.0 110.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<rect x="670.0" y="50.0" width="110.0" height="70.0" rx="6" class="blok"/>
<text x="725.0" y="78.0" text-anchor="middle" class="s-metin">atan2 / tablo</text>
<text x="725.0" y="96.0" text-anchor="middle" class="s-mono2">f = φ / (2π·τ)</text>
<path d="M780.0 85.0 L830.0 85.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<text x="834.0" y="89.0" text-anchor="start" class="s-mono s-vurgu">f</text>
<rect x="20.0" y="176.0" width="820.0" height="58.0" rx="6" class="blok" opacity=".8"/>
<text x="30.0" y="194.0" text-anchor="start" class="s-kucuk">Tek darbede (100 ns içinde) frekans verir; genlik bilgisi limiter'da atılır. Belirsizlik aralığı 1/τ: kaba (kısa τ) ve ince (uzun τ) birkaç korelatör birlikte kullanılır.</text>
<text x="30.0" y="210.0" text-anchor="start" class="s-kucuk">Zayıf noktası eşzamanlı sinyal: iki darbe üst üste gelirse tek ve yanlış bir frekans okur. Tipik olarak CVR ile birlikte RWR'lerde kullanılır.</text>
<text x="30.0" y="226.0" text-anchor="start" class="s-kucuk">Sayısal IFM: aynı ilke DDC çıkışında ardışık örneklerin faz farkıyla (anlık frekans) yapılır — Bölüm 25'in konusu.</text>
</svg>