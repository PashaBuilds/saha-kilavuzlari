<svg viewBox="0 0 960 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g112">
<title id="t-g112">SSR (super-sample rate) gösterimi: üstte ADC'nin 2400 MSPS'lik tek örnek akışı x[0], x[1], … ; altta FPGA'da 300 MHz fabric saatinin her vuruşunda 8 örneklik bir vektör: saat n'de lane k örneği x[8n + k] taşır. Sözcük genişliği 8 × 16 bit = 128 bit AXI-Stream; en düşük indisli lane en eski örnektir (sıra sözleşmesi belgelenmeli). 14 bitlik örnek 16 bitlik sözcüğe işaret uzatma ya da MSB hizalama ile yerleşir.</title>
<text x="20" y="22" class="s-baslik">SSR: 2400 MSPS tek akış → 8 paralel örnek × 300 MHz fabric saati</text>
<text x="20" y="58" class="s-kucuk s-vurgu">ADC çıkışı: örnek başına 417 ps</text>
