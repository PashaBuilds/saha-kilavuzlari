<text x="20" y="394" class="s-kucuk">fabric saati 300 MHz · veri hızı aynı: 8 × 16 bit × 300 MHz = 38.4 Gb/s</text>
<text x="20" y="420" class="s-kucuk">Örnek sözcüğü (16 bit): 14 bit 2'nin tümleyeni → işaret uzatma [s s d13 … d0] ya da MSB hizalı [d13 … d0 0 0]; hangisi olduğunu belge söyler, ölçek 4 kat farklıdır.</text>
<text x="20" y="438" class="s-kucuk">DSP tarafında sonuç: her blok (NCO, FIR, CIC) saat başına 8 örnek işler — Bölüm 12 ve 14'teki SSR gerçeklemesi bu sözleşmeyle başlar.</text>
