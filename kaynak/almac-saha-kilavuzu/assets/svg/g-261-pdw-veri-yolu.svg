<use href="#sym-gecikme" x="180" y="320" width="60" height="40"/><text x="210.0" y="374.0" text-anchor="middle" class="s-kucuk">ön-tetik</text><text x="210.0" y="386.0" text-anchor="middle" class="s-kucuk">SNAP_PRETRIG</text>
