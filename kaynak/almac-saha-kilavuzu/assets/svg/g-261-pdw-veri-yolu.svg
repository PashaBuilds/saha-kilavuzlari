<path d="M690 100 V165" class="yol-kontrol"/>
<use href="#sym-reg" x="880" y="60" width="60" height="40"/><text x="910.0" y="114.0" text-anchor="middle" class="s-kucuk">IRQ_STATUS</text><text x="910.0" y="126.0" text-anchor="middle" class="s-kucuk">IRQ_MASK</text>
<path d="M940 80 H990" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<text x="1010.0" y="76.0" text-anchor="start" class="s-kucuk s-yesil">IRQ: FIFO yarım /</text>
<text x="1010.0" y="88.0" text-anchor="start" class="s-kucuk s-yesil">taşma / snapshot hazır</text>
<path d="M1020 160 V100" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<text x="1030.0" y="130.0" text-anchor="start" class="s-kucuk s-yesil">AXI-Lite</text>
<text x="1030.0" y="142.0" text-anchor="start" class="s-kucuk s-yesil">okuma/yazma</text>
<path d="M810 205 V236" class="yol-gurultu" marker-end="url(#ok-gurultu)"/>
<text x="810.0" y="252.0" text-anchor="middle" class="s-kucuk s-kirmizi">FIFO dolu → PDW at, DROP_CNT++, IRQ bit1</text>
<text x="20.0" y="392.0" text-anchor="start" class="s-kucuk">Mavi: örnek/PDW verisi · yeşil: kontrol ve durum · kesikli: PL/PS sınırı. FIFO 128-bit sözcük başına bir PDW; DMA 4 KB'lik tanımlayıcılarla (32 PDW / tanımlayıcı) halka tampona yazar.</text>
<text x="20.0" y="408.0" text-anchor="start" class="s-kucuk">Zaman kolu (üst) ve frekans kolu (orta) farklı gecikmelerle çalışır; 'PDW birleştir' ikisini TOA ile eşler (Şekil g-262).</text>
