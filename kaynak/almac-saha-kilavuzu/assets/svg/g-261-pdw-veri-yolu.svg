<rect x="396" y="96" width="96" height="48" rx="5" class="blok"/><text x="444.0" y="120.0" text-anchor="middle" class="s-metin">ölçüm</text><text x="444.0" y="134.0" text-anchor="middle" class="s-mono2">faz→f, eğim</text>
<use href="#sym-fft" x="180" y="230" width="60" height="40"/><text x="210.0" y="284.0" text-anchor="middle" class="s-kucuk">FFT 1024</text><text x="210.0" y="296.0" text-anchor="middle" class="s-kucuk">Hann, %50</text>
