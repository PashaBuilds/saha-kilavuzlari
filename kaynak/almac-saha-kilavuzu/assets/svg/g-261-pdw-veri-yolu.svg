<rect x="650" y="165" width="100" height="40" rx="5" class="blok"/><text x="700.0" y="185.0" text-anchor="middle" class="s-metin">paketleyici</text><text x="700.0" y="199.0" text-anchor="middle" class="s-mono2">4 × 32 bit</text>
