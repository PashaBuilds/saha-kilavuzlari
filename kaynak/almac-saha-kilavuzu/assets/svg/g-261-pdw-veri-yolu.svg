<svg viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g261">
<title id="t-g261">PDW veri yolu PL'den PS'e: DDC çıkışı zaman koluna (güç zarfı, eşik karşılaştırıcı, darbe FSM, ölçüm) ve frekans koluna (FFT, tepe bulma, TOA eşleme) ayrılır; PDW birleştirici, paketleyici, 1024 derinlikli PDW FIFO, AXI-Stream, DMA ve PS halka tamponu; tetiklemeli snapshot RAM ikinci DMA kanalıyla; yeşil register'lar FIFO seviye, kontrol, drop sayacı, PDW sayacı ve kesme durumunu taşır</title>
<text x="20.0" y="24.0" text-anchor="start" class="s-baslik">PDW veri yolu — PL'de üretim, AXI-Stream + DMA ile PS'e taşıma (kurgusal register adları Bölüm 30 ile aynı)</text>
<text x="20.0" y="118.0" text-anchor="start" class="s-kucuk">DDC çıkışı</text>
<text x="20.0" y="130.0" text-anchor="start" class="s-kucuk">I/Q 300 MSPS</text>
<use href="#sym-zarf" x="90" y="100" width="60" height="40"/><text x="120.0" y="154.0" text-anchor="middle" class="s-kucuk">I²+Q²</text><text x="120.0" y="166.0" text-anchor="middle" class="s-kucuk">+ MA(4)</text>
