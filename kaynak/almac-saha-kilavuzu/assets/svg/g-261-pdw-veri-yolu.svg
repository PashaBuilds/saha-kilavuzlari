<rect x="396" y="226" width="96" height="48" rx="5" class="blok"/><text x="444.0" y="250.0" text-anchor="middle" class="s-metin">gecikme /</text><text x="444.0" y="264.0" text-anchor="middle" class="s-mono2">TOA eşleme</text>
