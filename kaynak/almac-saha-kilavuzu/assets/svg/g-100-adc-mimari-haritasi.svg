<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g100">
<title id="t-g100">ADC mimarileri hız–çözünürlük haritası (yaklaşık, öğretici bölgeler): yatay eksen örnekleme hızı 1 kSPS–100 GSPS logaritmik, düşey eksen çözünürlük bit. Sigma-delta yüksek çözünürlük düşük hız; SAR orta hız orta-yüksek çözünürlük; pipeline yüksek hız 12–16 bit; flash çok yüksek hız 6–8 bit; time-interleaved pipeline/SAR bölgeyi GSPS'e uzatır. Direct RF-sampling ADC bölgesi 1–10 GSPS, 12–14 bit; referans senaryo 2.4 GSPS 14 bit işaretli.</title>
<text x="70" y="24" class="s-baslik">ADC mimarileri: hız ↔ çözünürlük (yaklaşık bölgeler, öğretici)</text>
<path d="M70.0 50 V350" class="izgara"/>
<text x="70.0" y="366" text-anchor="middle" class="s-kucuk">1 k</text>
<path d="M168.8 50 V350" class="izgara"/>
<text x="168.8" y="366" text-anchor="middle" class="s-kucuk">10 k</text>
<path d="M267.5 50 V350" class="izgara"/>
<text x="267.5" y="366" text-anchor="middle" class="s-kucuk">100 k</text>
<path d="M366.2 50 V350" class="izgara"/>
<text x="366.2" y="366" text-anchor="middle" class="s-kucuk">1 M</text>
<path d="M465.0 50 V350" class="izgara"/>
<text x="465.0" y="366" text-anchor="middle" class="s-kucuk">10 M</text>
<path d="M563.8 50 V350" class="izgara"/>
<text x="563.8" y="366" text-anchor="middle" class="s-kucuk">100 M</text>
<path d="M662.5 50 V350" class="izgara"/>
<text x="662.5" y="366" text-anchor="middle" class="s-kucuk">1 G</text>
<path d="M761.2 50 V350" class="izgara"/>
<text x="761.2" y="366" text-anchor="middle" class="s-kucuk">10 G</text>
<path d="M860.0 50 V350" class="izgara"/>
<text x="860.0" y="366" text-anchor="middle" class="s-kucuk">100 G</text>
<path d="M70 350.0 H860" class="izgara"/><text x="64" y="354.0" text-anchor="end" class="s-kucuk">4</text>
<path d="M70 322.7 H860" class="izgara"/><text x="64" y="326.7" text-anchor="end" class="s-kucuk">6</text>
<path d="M70 295.5 H860" class="izgara"/><text x="64" y="299.5" text-anchor="end" class="s-kucuk">8</text>
<path d="M70 268.2 H860" class="izgara"/><text x="64" y="272.2" text-anchor="end" class="s-kucuk">10</text>
<path d="M70 240.9 H860" class="izgara"/><text x="64" y="244.9" text-anchor="end" class="s-kucuk">12</text>
<path d="M70 213.6 H860" class="izgara"/><text x="64" y="217.6" text-anchor="end" class="s-kucuk">14</text>
<path d="M70 186.4 H860" class="izgara"/><text x="64" y="190.4" text-anchor="end" class="s-kucuk">16</text>
<path d="M70 159.1 H860" class="izgara"/><text x="64" y="163.1" text-anchor="end" class="s-kucuk">18</text>
<path d="M70 131.8 H860" class="izgara"/><text x="64" y="135.8" text-anchor="end" class="s-kucuk">20</text>
<path d="M70 104.5 H860" class="izgara"/><text x="64" y="108.5" text-anchor="end" class="s-kucuk">22</text>
<path d="M70 77.3 H860" class="izgara"/><text x="64" y="81.3" text-anchor="end" class="s-kucuk">24</text>
<path d="M70 50.0 H860" class="izgara"/><text x="64" y="54.0" text-anchor="end" class="s-kucuk">26</text>
<rect x="70" y="50" width="790" height="300" class="eksen"/>
<text x="465.0" y="384" text-anchor="middle" class="s-kucuk">örnekleme hızı (SPS, log)</text>
<text x="16" y="200.0" text-anchor="middle" transform="rotate(-90 16 200.0)" class="s-kucuk">çözünürlük (bit)</text>
<ellipse cx="282.4" cy="131.8" rx="212.4" ry="54.5" class="spk-filtre" opacity=".45"/>
<text x="282.4" y="135.8" text-anchor="middle" class="s-kucuk s-altin">ΣΔ (sigma-delta)</text>
<ellipse cx="366.2" cy="200.0" rx="197.5" ry="68.2" class="spk-sinyal" opacity=".45"/>
<text x="366.2" y="204.0" text-anchor="middle" class="s-kucuk s-vurgu">SAR</text>
<ellipse cx="587.3" cy="227.3" rx="92.6" ry="40.9" class="spk-sinyal" opacity=".45"/>
<text x="587.3" y="231.3" text-anchor="middle" class="s-kucuk s-vurgu">pipeline</text>
<ellipse cx="726.7" cy="254.5" rx="64.2" ry="40.9" style="fill:var(--purple)" opacity=".4"/>
<text x="726.7" y="255.5" text-anchor="middle" class="s-kucuk" style="fill:var(--ink)">time-interleaved</text>
<text x="726.7" y="269.5" text-anchor="middle" class="s-kucuk" style="fill:var(--ink)">(pipeline/SAR)</text>
<ellipse cx="761.2" cy="322.7" rx="98.8" ry="27.3" class="spk-gurultu" opacity=".45"/>
<text x="761.2" y="326.7" text-anchor="middle" class="s-kucuk s-metin2">flash</text>
<rect x="662.5" y="206.8" width="106.6" height="40.9" rx="6" fill="none" stroke="var(--green)" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="852" y="84" text-anchor="end" class="s-kucuk s-yesil">yeşil kesikli çerçeve: direct RF-sampling ADC bölgesi (≈ 1–10 GSPS, 12–14 bit)</text>
<circle cx="700.0" cy="213.6" r="6" style="fill:var(--gold);stroke:var(--bg);stroke-width:1.5"/>
<text x="710.0" y="203.6" class="s-kucuk s-altin">referans: 2.4 GSPS, 14 bit</text>
<text x="78" y="66" class="s-kucuk">Eğilim: hız 10× ↑ ≈ çözünürlük 2–3 bit ↓ (aperture jitter ve güç sınırı). Etiketteki bit ≠ ENOB.</text>
<text x="70" y="412" class="s-kucuk">Sınırlar kesin değildir; üreticiler bölgeleri sürekli genişletir. Konum yalnızca "hangi mimari nerede yaşar" sezgisi içindir.</text>
</svg>