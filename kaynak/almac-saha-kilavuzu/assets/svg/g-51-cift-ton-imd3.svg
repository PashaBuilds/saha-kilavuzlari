<text x="389.4" y="536.9" text-anchor="start" class="s-kucuk s-altin">P1dB (giriş -5, çıkış +15 dBm)</text>
<text x="560.0" y="748.0" text-anchor="end" class="s-kucuk">giriş gücü / ton (dBm)</text>
