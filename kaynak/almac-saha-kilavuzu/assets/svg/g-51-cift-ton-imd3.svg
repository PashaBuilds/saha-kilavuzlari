<title id="t-g51">Çift ton testi ve IP3: (1) geniş spektrumda iki ton ve 2f, 3f harmonikleri; (2) yakınlaştırılmış spektrumda IMD3 ürünleri 2f1−f2 ve 2f2−f1 tonların 10 MHz yanında, gürültü tabanı gri; (3) giriş–çıkış grafiğinde temel bileşen eğim 1, IMD3 eğim 3, uzantıları IP3'te kesişir, P1dB noktası işaretli; sağda çift ton SFDR formülü.</title>
