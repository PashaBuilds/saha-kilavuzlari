<text x="602.0" y="500.0" text-anchor="start" class="s-metin">Çift ton SFDR (giriş referanslı):</text>
<text x="602.0" y="516.0" text-anchor="start" class="s-metin">SFDR = ⅔ · (IIP3 − MDS)</text>
<text x="602.0" y="532.0" text-anchor="start" class="s-kucuk"></text>
<text x="602.0" y="548.0" text-anchor="start" class="s-kucuk">Okuma: iki ton MDS'nin SFDR dB</text>
<text x="602.0" y="564.0" text-anchor="start" class="s-kucuk">üstündeyse IMD3 ürünü tam gürültü</text>
<text x="602.0" y="580.0" text-anchor="start" class="s-kucuk">tabanına değer. Daha güçlü ton →</text>
<text x="602.0" y="596.0" text-anchor="start" class="s-kucuk">IMD3 tespit eşiğini aşar, 'hayalet'</text>
<text x="602.0" y="612.0" text-anchor="start" class="s-kucuk">darbe üretir.</text>
<text x="602.0" y="628.0" text-anchor="start" class="s-kucuk"></text>
<text x="602.0" y="644.0" text-anchor="start" class="s-metin">Kural: IIP3 ≈ IP1dB + 10 dB</text>
<text x="602.0" y="660.0" text-anchor="start" class="s-kucuk">(cihazdan cihaza 8–15 dB oynar).</text>
<text x="602.0" y="676.0" text-anchor="start" class="s-kucuk"></text>
<text x="602.0" y="692.0" text-anchor="start" class="s-kucuk">Eğim 3 → giriş 1 dB artınca IMD3</text>
<text x="602.0" y="708.0" text-anchor="start" class="s-kucuk">3 dB, dBc cinsinden 2 dB büyür.</text>
