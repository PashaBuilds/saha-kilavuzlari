<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g103">
<title id="t-g103">Aynı senaryo için iki almaç zinciri yan yana. Üstte süperhet + IF örnekleme (referans): anten, limiter, LNA, preselector, mixer + LO 7.6 GHz, IF filtre 1.8 GHz, IF yükselteç, AAF, ADC 2400 MSPS, FPGA'da DDC. Altta direct RF sampling: anten, limiter, LNA, bant seçici filtre, (opsiyonel) sürücü, RF ADC ≈ 5 GSPS (örnek; 9.4 GHz 4. Nyquist bölgesinde, alias 600 MHz, evrik) ve çip içi DDC. Silinen bloklar: mixer, LO sentezleyici, IF filtre, IF yükselteç. Kalanlar: limiter, LNA, bant seçici filtre, saat kalitesi ihtiyacı (artar).</title>
<text x="20" y="22" class="s-baslik">Aynı darbe, iki zincir — üstte süperhet + IF örnekleme (referans senaryo), altta direct RF sampling</text>
<text x="20" y="64" class="s-metin2 s-altin">A · Süperhet + IF örnekleme</text>
<use href="#sym-anten" x="20" y="80" width="60" height="40"/><text x="50.0" y="133" text-anchor="middle" class="s-kucuk">anten</text>
<path d="M80.0 100.0 L98.0 100.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-limiter" x="100" y="80" width="60" height="40"/><text x="130.0" y="133" text-anchor="middle" class="s-kucuk">limiter</text>
<path d="M160.0 100.0 L178.0 100.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-amp" x="180" y="80" width="60" height="40"/><text x="210.0" y="133" text-anchor="middle" class="s-kucuk">LNA</text>
<path d="M240.0 100.0 L258.0 100.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-bpf" x="260" y="80" width="60" height="40"/><text x="290.0" y="133" text-anchor="middle" class="s-kucuk">preselector</text>
<path d="M320.0 100.0 L338.0 100.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-mixer" x="340" y="80" width="60" height="40"/><text x="370.0" y="133" text-anchor="middle" class="s-kucuk">mixer</text>
<path d="M400.0 100.0 L418.0 100.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-bpf" x="420" y="80" width="60" height="40"/><text x="450.0" y="133" text-anchor="middle" class="s-kucuk">IF filtre 1.8 GHz</text>
<path d="M480.0 100.0 L498.0 100.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-amp" x="500" y="80" width="60" height="40"/><text x="530.0" y="133" text-anchor="middle" class="s-kucuk">IF yükselteç</text>
<path d="M560.0 100.0 L578.0 100.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-bpf" x="580" y="80" width="60" height="40"/><text x="610.0" y="133" text-anchor="middle" class="s-kucuk">AAF (2. bölge)</text>
<path d="M640.0 100.0 L658.0 100.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="660" y="80" width="60" height="40"/><text x="690.0" y="133" text-anchor="middle" class="s-kucuk">ADC 2400 MSPS</text>
<path d="M720.0 100.0 L738.0 100.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fft" x="740" y="80" width="60" height="40"/><text x="770.0" y="133" text-anchor="middle" class="s-kucuk">FPGA: DDC…</text>
<use href="#sym-lo" x="340" y="140" width="60" height="30"/>
<path d="M370 140 V122" class="yol-saat" marker-end="url(#ok-saat)"/>
<text x="406" y="160" class="s-kucuk">LO 7.6 GHz (low-side)</text>
<use href="#sym-saat" x="660" y="140" width="60" height="30"/>
<path d="M690 140 V122" class="yol-saat" marker-end="url(#ok-saat)"/>
<text x="726" y="160" class="s-kucuk">saat 2400 MHz, σ ≈ 100 fs → jitter SNR 58.9 dB</text>
<text x="20" y="192" class="s-kucuk">RF 9.4 GHz → IF 1.8 GHz → 2. bölge → 600 MHz evrik · image 5.8 GHz preselector ile bastırılır · ADC giriş BW ≥ 2 GHz yeter</text>
<text x="20" y="214" class="s-metin2 s-vurgu">B · Direct RF sampling (örnek fs; cihaza göre değişir)</text>
<use href="#sym-anten" x="20" y="230" width="60" height="40"/><text x="50.0" y="283" text-anchor="middle" class="s-kucuk">anten</text>
<path d="M80.0 250.0 L98.0 250.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-limiter" x="100" y="230" width="60" height="40"/><text x="130.0" y="283" text-anchor="middle" class="s-kucuk">limiter</text>
<path d="M160.0 250.0 L178.0 250.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-amp" x="180" y="230" width="60" height="40"/><text x="210.0" y="283" text-anchor="middle" class="s-kucuk">LNA</text>
<path d="M240.0 250.0 L258.0 250.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-bpf" x="260" y="230" width="60" height="40"/><text x="290.0" y="283" text-anchor="middle" class="s-kucuk">bant seçici (X-bant)</text>
<path d="M320.0 250.0 L338.0 250.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<rect x="340" y="228" width="60" height="44" rx="4" fill="none" stroke="var(--red)" stroke-dasharray="4 3"/>
<text x="370" y="248" text-anchor="middle" class="s-kucuk s-kirmizi">mixer</text>
<text x="370" y="262" text-anchor="middle" class="s-kucuk s-kirmizi">silindi</text>
<path d="M400.0 250.0 L418.0 250.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<rect x="420" y="228" width="60" height="44" rx="4" fill="none" stroke="var(--red)" stroke-dasharray="4 3"/>
<text x="450" y="248" text-anchor="middle" class="s-kucuk s-kirmizi">bpf</text>
<text x="450" y="262" text-anchor="middle" class="s-kucuk s-kirmizi">silindi</text>
<path d="M480.0 250.0 L498.0 250.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-amp" x="500" y="230" width="60" height="40"/><text x="530.0" y="283" text-anchor="middle" class="s-kucuk">sürücü (ops.)</text>
<path d="M560.0 250.0 L578.0 250.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-bpf" x="580" y="230" width="60" height="40"/><text x="610.0" y="283" text-anchor="middle" class="s-kucuk">AAF (4. bölge)</text>
<path d="M640.0 250.0 L658.0 250.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="660" y="230" width="60" height="40"/><text x="690.0" y="283" text-anchor="middle" class="s-kucuk">RF ADC ≈ 5 GSPS</text>
<path d="M720.0 250.0 L738.0 250.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fft" x="740" y="230" width="60" height="40"/><text x="770.0" y="283" text-anchor="middle" class="s-kucuk">çip içi DDC</text>
<use href="#sym-saat" x="660" y="290" width="60" height="30"/>
<path d="M690 290 V272" class="yol-saat" marker-end="url(#ok-saat)"/>
<text x="726" y="310" class="s-kucuk">saat ≈ 5 GHz, σ ≈ 100 fs → jitter SNR 44.6 dB (f_in = 9.4 GHz!)</text>
<text x="20" y="342" class="s-kucuk">RF 9.4 GHz doğrudan → 4. bölge → alias 600 MHz, evrik · ADC analog giriş BW ≥ 9.4 GHz şart · bant seçici filtre komşu bölgeleri (ör. 0.6 GHz, 4.4 GHz) bastırmalı</text>
<text x="20" y="372" class="s-kucuk">Silinenler: mixer, LO sentezleyici, IF filtre, IF yükselteç. Kalanlar: limiter, LNA, bant seçici/AAF. Artanlar: saat kalitesi, ADC giriş BW, güç, veri hızı (çip içi DDC ile geri alınır).</text>
</svg>