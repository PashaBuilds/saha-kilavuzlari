<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g140">
<title id="t-g140">Faz çarkı ve akümülatör: çark her saatte FTW kadar döner, 2^N'de taşıp başa sarar; akümülatör değeri testere dişi, altında üretilen kosinüs</title>
<!-- Sol: faz çarkı -->
<g transform="translate(170,150)">
  <circle r="100" fill="var(--dia-blok)" stroke="var(--line-2)" stroke-width="1.5"/>
  <circle r="100" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 6" opacity=".5"/>
  <!-- 16 tik -->
  <g stroke="var(--ink-3)" stroke-width="1">
    <line x1="0" y1="-100" x2="0" y2="-92"/><line x1="70.7" y1="-70.7" x2="65" y2="-65"/><line x1="100" y1="0" x2="92" y2="0"/><line x1="70.7" y1="70.7" x2="65" y2="65"/>
    <line x1="0" y1="100" x2="0" y2="92"/><line x1="-70.7" y1="70.7" x2="-65" y2="65"/><line x1="-100" y1="0" x2="-92" y2="0"/><line x1="-70.7" y1="-70.7" x2="-65" y2="-65"/>
  </g>
  <text x="0" y="-108" text-anchor="middle" class="s-mono2">0 = 2^N (taşma)</text>
  <text x="112" y="4" class="s-mono2">2^N/4</text>
  <text x="0" y="118" text-anchor="middle" class="s-mono2">2^N/2</text>
  <text x="-112" y="4" text-anchor="end" class="s-mono2">3·2^N/4</text>
  <!-- adımlar: FTW = 2^N/8 -> 45° -->
  <g fill="var(--accent)">
    <circle cx="0" cy="-100" r="5"/>
    <circle cx="70.7" cy="-70.7" r="5"/>
    <circle cx="100" cy="0" r="5"/>
    <circle cx="70.7" cy="70.7" r="5" opacity=".7"/>
    <circle cx="0" cy="100" r="5" opacity=".5"/>
  </g>
  <path d="M0 -100 A100 100 0 0 1 70.7 -70.7" fill="none" stroke="var(--gold)" stroke-width="3" marker-end="url(#ok-analog)"/>
  <text x="48" y="-96" class="s-metin s-altin">+FTW</text>
  <line x1="0" y1="0" x2="70.7" y2="-70.7" stroke="var(--accent)" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="-100" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle r="4" fill="var(--ink)"/>
  <text x="10" y="20" class="s-metin2">θ = acc·2π/2^N</text>
  <!-- izdüşüm -->
  <line x1="70.7" y1="-70.7" x2="70.7" y2="0" stroke="var(--green)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="76" y="-30" class="s-kucuk s-yesil">cos θ</text>
  <text x="-6" y="150" text-anchor="middle" class="s-metin">Faz çarkı — her saat vuruşu bir adım</text>
</g>
<!-- Sağ: akümülatör testere dişi + kosinüs -->
<g transform="translate(350,30)">
  <text x="0" y="0" class="s-baslik">Faz akümülatörü (acc)</text>
  <rect x="0" y="10" width="500" height="130" fill="var(--dia-blok)" stroke="var(--line)"/>
  <line x1="0" y1="20" x2="500" y2="20" class="izgara"/>
  <text x="504" y="24" class="s-mono2">2^N</text>
  <text x="504" y="142" class="s-mono2">0</text>
  <!-- testere dişi: periyot 8 adım = 125 px -->
  <polyline points="0,140 15.6,125 31.2,110 46.9,95 62.5,80 78.1,65 93.8,50 109.4,35 125,20 125,140 140.6,125 156.2,110 171.9,95 187.5,80 203.1,65 218.8,50 234.4,35 250,20 250,140 265.6,125 281.2,110 296.9,95 312.5,80 328.1,65 343.8,50 359.4,35 375,20 375,140 390.6,125 406.2,110 421.9,95 437.5,80 453.1,65 468.8,50 484.4,35 500,20" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <g fill="var(--accent)">
    <circle cx="0" cy="140" r="2.5"/><circle cx="15.6" cy="125" r="2.5"/><circle cx="31.2" cy="110" r="2.5"/><circle cx="46.9" cy="95" r="2.5"/><circle cx="62.5" cy="80" r="2.5"/><circle cx="78.1" cy="65" r="2.5"/><circle cx="93.8" cy="50" r="2.5"/><circle cx="109.4" cy="35" r="2.5"/>
  </g>
  <!-- FTW adımı -->
  <line x1="46.9" y1="95" x2="62.5" y2="95" stroke="var(--gold)" stroke-width="1.4"/>
  <line x1="62.5" y1="95" x2="62.5" y2="80" stroke="var(--gold)" stroke-width="1.4"/>
  <text x="66" y="94" class="s-kucuk s-altin">FTW</text>
  <!-- taşma işaretleri -->
  <g stroke="var(--red)" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="125" y1="10" x2="125" y2="160"/><line x1="250" y1="10" x2="250" y2="160"/><line x1="375" y1="10" x2="375" y2="160"/>
  </g>
  <text x="128" y="156" class="s-kucuk s-kirmizi">taşma → yeni periyot</text>
  <!-- kosinüs -->
  <text x="0" y="190" class="s-baslik">Üretilen çıkış: cos(2π·acc/2^N)</text>
  <rect x="0" y="200" width="500" height="110" fill="var(--dia-blok)" stroke="var(--line)"/>
  <line x1="0" y1="255" x2="500" y2="255" class="izgara"/>
  <path d="M0 210 C 20 210 40 255 62.5 255 S 105 300 125 300 S 165 255 187.5 255 S 230 210 250 210 S 290 255 312.5 255 S 355 300 375 300 S 415 255 437.5 255 S 480 210 500 210" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <g fill="var(--accent)">
    <circle cx="0" cy="210" r="2.5"/><circle cx="15.6" cy="217" r="2.5"/><circle cx="31.2" cy="236" r="2.5"/><circle cx="46.9" cy="255" r="2.5"/><circle cx="62.5" cy="274" r="2.5"/><circle cx="78.1" cy="290" r="2.5"/><circle cx="93.8" cy="300" r="2.5"/><circle cx="109.4" cy="290" r="2.5"/>
  </g>
  <text x="504" y="214" class="s-mono2">+1</text><text x="504" y="304" class="s-mono2">−1</text>
  <text x="0" y="330" class="s-metin2">periyot = 2^N/FTW saat → f_out = fs·FTW/2^N (burada FTW = 2^N/8 → f_out = fs/8)</text>
  <text x="500" y="176" text-anchor="end" class="s-kucuk">n (saat vuruşu) →</text>
</g>
</svg>
