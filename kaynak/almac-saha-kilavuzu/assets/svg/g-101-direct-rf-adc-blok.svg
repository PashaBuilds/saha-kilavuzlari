<svg viewBox="0 0 1040 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g101">
<title id="t-g101">Jenerik direct RF-sampling ADC iç blok şeması: analog giriş tamponu ve track-and-hold (altın), M yollu time-interleaved ADC çekirdekleri, interleave kalibrasyon bloğu; sayısal tarafta (mavi) çip içi DDC — NCO, kompleks mixer, decimation filtreleri — ve JESD204 verici (lane'ler). Saat girişi, çip içi PLL/bölücü ve SYSREF gri kesikli; SPI/register ve kalibrasyon kontrolü yeşil. Bypass yolu: DDC atlanıp tam hız reel örnek çıkışı.</title>
<text x="20" y="24" class="s-baslik">Direct RF-sampling ADC — jenerik iç yapı (blok adları üreticiye göre değişir)</text>
