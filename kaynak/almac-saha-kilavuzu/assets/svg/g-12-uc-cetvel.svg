<title id="t-g12">Üç cetvel: aynı seviyenin anten girişinde dBm, ADC girişinde dBm (zincir kazancı +40 dB) ve sayısal alanda dBFS (0 dBFS = +4 dBm) karşılıkları. İşaretli seviyeler: ADC tam ölçeği, referans darbe (−60 dBm antende → −20 dBm ADC'de → −24 dBFS), 300 MHz gürültü tabanı ve MDS. İki sabit (kazanç ve tam ölçek dBm'i) bilinince FFT ekranındaki dBFS anten girişine referanslanır.</title>
