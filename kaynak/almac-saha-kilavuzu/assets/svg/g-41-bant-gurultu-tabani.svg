<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g41">
<title id="t-g41">Bant genişliği ile gürültü tabanı ve hassasiyet ilişkisi. Solda logaritmik bant genişliği ekseni (1 kHz–10 GHz): kTB·B çizgisi (NF = 0), NF = 6 dB ile kayan gürültü tabanı ve +15 dB tespit SNR'ı ile MDS; 2 MHz (darbeye eşlenik), 300 MHz (referans) ve 1 GHz noktaları işaretli. Her on kat bant genişliği tabanı 10 dB yükseltir. Sağda 1 µs darbenin spektrumu üstünde iki almaç bandı: dar bant (2 MHz) az gürültü alır ama darbenin frekansını önceden bilmeyi gerektirir; geniş bant (300 MHz) darbeyi nerede olursa olsun yakalar (POI), bedeli 21.8 dB daha yüksek gürültü tabanı.</title>
<text x="70" y="30" class="s-baslik">Gürültü tabanı = kTB · B · F</text>
<line x1="70.0" y1="50" x2="70.0" y2="330" class="izgara"/>
<text x="70.0" y="344" text-anchor="middle" class="s-mono2">1 kHz</text>
