<svg viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g302">
<title id="t-g302">Kurgusal register bit haritaları: CFAR_CTRL (bit 1:0 tip, 7:2 N/2, 11:8 guard, 12 etkin), CFAR_ALPHA Q6.10 (21.94 → 0x57C3), NCO_FTW 32 bit (0x40000000 = 600 MHz) ve sabit nokta okuma örnekleri</title>
<style>
  .rb .alan { fill: var(--dia-blok); stroke: var(--line-2); stroke-width: 1; }
  .rb .a1 { fill: var(--accent-soft); stroke: var(--accent); }
  .rb .a2 { fill: var(--gold-soft); stroke: var(--gold); }
  .rb .a3 { fill: var(--green-soft); stroke: var(--green); }
  .rb .a4 { fill: var(--purple-soft); stroke: var(--purple); }
  .rb .bit { font-family: var(--mono); font-size: 9px; fill: var(--ink-3); }
  .rb .ad { font-family: var(--sans); font-size: 10.5px; fill: var(--ink); }
  .rb .bas { font-family: var(--mono); font-size: 12px; font-weight: 700; fill: var(--ink); }
  .rb .t { font-family: var(--sans); font-size: 11px; fill: var(--ink-2); }
  .rb .m { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
</style>
<g class="rb">
<!-- CFAR_CTRL -->
<text class="bas" x="20" y="26">CFAR_CTRL  (0x044)</text>
<g transform="translate(20,34)">
  <!-- 16 bit, her bit 52 px genişlik -->
  <rect class="alan" x="0" y="0" width="156" height="30"/><text class="ad" x="78" y="19" text-anchor="middle">ayrılmış</text>
  <rect class="alan a4" x="156" y="0" width="52" height="30"/><text class="ad" x="182" y="19" text-anchor="middle">etkin</text>
  <rect class="alan a3" x="208" y="0" width="208" height="30"/><text class="ad" x="312" y="19" text-anchor="middle">guard (hücre/taraf)</text>
  <rect class="alan a2" x="416" y="0" width="312" height="30"/><text class="ad" x="572" y="19" text-anchor="middle">N/2 (referans hücre / taraf)</text>
  <rect class="alan a1" x="728" y="0" width="104" height="30"/><text class="ad" x="780" y="19" text-anchor="middle">tip</text>
  <g class="bit">
    <text x="0" y="42">15</text><text x="156" y="42">12</text><text x="208" y="42">11</text><text x="416" y="42">7</text><text x="728" y="42">1</text><text x="822" y="42">0</text>
  </g>
</g>
<text class="t" x="20" y="98">tip: 0 CA · 1 GO · 2 SO · 3 OS      referans senaryo: CA, N = 16 → N/2 = 8, guard = 2, etkin = 1</text>
<text class="m" x="20" y="116">= (1 &lt;&lt; 12) | (2 &lt;&lt; 8) | (8 &lt;&lt; 2) | 0 = 0x1220</text>
<!-- CFAR_ALPHA -->
<text class="bas" x="20" y="152">CFAR_ALPHA  (0x048)  —  Q6.10</text>
<g transform="translate(20,160)">
  <rect class="alan a2" x="0" y="0" width="312" height="30"/><text class="ad" x="156" y="19" text-anchor="middle">tam kısım (6 bit) — 0…63</text>
  <rect class="alan a1" x="312" y="0" width="520" height="30"/><text class="ad" x="572" y="19" text-anchor="middle">kesir (10 bit) — 1/1024 adım</text>
  <g class="bit"><text x="0" y="42">15</text><text x="312" y="42">9</text><text x="822" y="42">0</text></g>
</g>
<text class="t" x="20" y="224">α = 21.94 → round(21.94 · 1024) = 22 467 = <tspan class="m">0x57C3</tspan>   ·   geri okuma: 0x57C3 / 1024 = 21.94</text>
<text class="t" x="20" y="242" fill="var(--red)">Q10.6 sanılırsa aynı değer 351.0 okunur; Q10.6 olarak 21.94 yazılırsa (0x057C) donanım 1.37 görür → false alarm patlar.</text>
<!-- NCO_FTW -->
<text class="bas" x="20" y="276">NCO_FTW  (0x010)  —  32 bit, tam tur = 2^32</text>
<text class="t" x="20" y="296"><tspan class="m">0x40000000</tspan> = 2^30 = ¼ tur/saat → 600 MHz @ 2400 MSPS   ·   üst bit 1 → negatif frekans (ters dönüş)</text>
</g>
</svg>
