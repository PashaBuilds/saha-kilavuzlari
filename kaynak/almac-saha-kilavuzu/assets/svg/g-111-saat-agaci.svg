<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g111">
<title id="t-g111">Almaç kartı saat ağacı: sistem referansı (10/100 MHz OCXO ya da şasi referansı) → jitter temizleyici çift döngülü PLL (PLL1 dar bantlı VCXO'ya kilitler, PLL2 geniş bantlı VCO ile GHz'e çarpar) → bölücüler → ADC örnekleme saati 2400 MHz, ADC SYSREF, FPGA GT referans saati, FPGA SYSREF ve isteğe bağlı fabric saati; PS saati ayrı. Saat yolları gri kesikli, çiftler (DCLK/SYSREF) aynı bölücü zincirinden. Jitter bütçesi: σ_toplam² = σ_saat² + σ_aperture².</title>
<text x="20" y="22" class="s-baslik">Saat ağacı — referanstan ADC örnekleme saatine ve FPGA'ya</text>
<use href="#sym-saat" x="20" y="100" width="60" height="40"/><text x="50.0" y="153" text-anchor="middle" class="s-kucuk">sistem referansı</text>
<text x="50" y="166" text-anchor="middle" class="s-kucuk">10 / 100 MHz OCXO ya da şasi</text>
<path d="M80 120 H118" class="yol-saat" marker-end="url(#ok-saat)"/>
<rect x="120" y="50" width="330" height="200" rx="8" class="blok" opacity=".5"/>
<text x="130" y="68" class="s-metin2">jitter temizleyici / saat üreteci (çift döngü)</text>
<rect x="140" y="98" width="90" height="44" rx="4" class="blok-aktif"/><text x="185.0" y="117.0" text-anchor="middle" class="s-metin2">PLL1</text><text x="185.0" y="131.0" text-anchor="middle" class="s-kucuk">dar bant, temizler</text>
<path d="M230 120 H258" class="yol-saat" marker-end="url(#ok-saat)"/>
<rect x="260" y="98" width="70" height="44" rx="4" class="blok"/><text x="295.0" y="117.0" text-anchor="middle" class="s-metin2">VCXO</text><text x="295.0" y="131.0" text-anchor="middle" class="s-kucuk">ör. 100 MHz</text>
<path d="M330 120 H358" class="yol-saat" marker-end="url(#ok-saat)"/>
<rect x="360" y="98" width="80" height="44" rx="4" class="blok-aktif"/><text x="400.0" y="117.0" text-anchor="middle" class="s-metin2">PLL2 + VCO</text><text x="400.0" y="131.0" text-anchor="middle" class="s-kucuk">geniş bant, çarpar</text>
<path d="M400 142 V180" class="yol-saat" marker-end="url(#ok-saat)"/>
<rect x="300" y="182" width="140" height="40" rx="4" class="blok"/><text x="370.0" y="199.0" text-anchor="middle" class="s-metin2">bölücüler / dağıtım</text><text x="370.0" y="213.0" text-anchor="middle" class="s-kucuk">DCLK + SYSREF çiftleri</text>
<text x="140" y="180" class="s-kucuk">PLL1 çıkışı: referansın uzun vadeli doğruluğu</text>
<text x="140" y="194" class="s-kucuk">+ VCXO'nun temiz faz gürültüsü</text>
<text x="140" y="208" class="s-kucuk">PLL2 çıkışı: GHz sınıfı, σ ≈ on–yüz fs</text>
<path d="M440 202 H470 V70 H560" class="yol-saat" marker-end="url(#ok-saat)"/>
<text x="566" y="74" class="s-kucuk">ADC saati 2400 MHz</text>
<path d="M440 202 H470 V110 H560" class="yol-saat" marker-end="url(#ok-saat)"/>
<text x="566" y="114" class="s-kucuk">ADC SYSREF</text>
<path d="M440 202 H470 V160 H560" class="yol-saat" marker-end="url(#ok-saat)"/>
<text x="566" y="164" class="s-kucuk">FPGA GT refclk (ör. 300 MHz)</text>
<path d="M440 202 H470 V200 H560" class="yol-saat" marker-end="url(#ok-saat)"/>
<text x="566" y="204" class="s-kucuk">FPGA SYSREF</text>
<path d="M440 202 H470 V240 H560" class="yol-saat" marker-end="url(#ok-saat)"/>
<text x="566" y="244" class="s-kucuk">fabric saati (ör. 300 MHz, ops.)</text>
<rect x="760" y="50" width="220" height="80" rx="8" class="blok-analog"/>
<text x="870" y="74" text-anchor="middle" class="s-metin2 s-altin">ADC</text>
<text x="870" y="92" text-anchor="middle" class="s-kucuk">örnekleme saati → T/H · SYSREF → LMFC</text>
<text x="870" y="110" text-anchor="middle" class="s-kucuk">σ_toplam² = σ_saat² + σ_aperture²</text>
<path d="M740 70 H758" class="yol-saat" marker-end="url(#ok-saat)"/><path d="M740 110 H758" class="yol-saat" marker-end="url(#ok-saat)"/>
<rect x="760" y="150" width="220" height="110" rx="8" class="blok-aktif"/>
<text x="870" y="172" text-anchor="middle" class="s-metin2 s-vurgu">FPGA</text>
<text x="870" y="190" text-anchor="middle" class="s-kucuk">GT refclk → SerDes PLL (JESD PHY)</text>
<text x="870" y="206" text-anchor="middle" class="s-kucuk">SYSREF → LMFC (RX), fabric'te yakalanır</text>
<text x="870" y="222" text-anchor="middle" class="s-kucuk">fabric saati: JESD çıkışından (link clock)</text>
<text x="870" y="238" text-anchor="middle" class="s-kucuk">ya da ayrı giriş; MMCM ile türetilir</text>
<path d="M740 160 H758" class="yol-saat" marker-end="url(#ok-saat)"/><path d="M740 200 H758" class="yol-saat" marker-end="url(#ok-saat)"/><path d="M740 240 H758" class="yol-saat" marker-end="url(#ok-saat)"/>
<rect x="760" y="280" width="220" height="50" rx="8" class="blok-kontrol"/>
<text x="870" y="300" text-anchor="middle" class="s-metin2 s-yesil">PS (işlemci) saati</text>
<text x="870" y="318" text-anchor="middle" class="s-kucuk">ayrı kristal; örnekleme saatiyle ilişkisiz</text>
<text x="20" y="330" class="s-kucuk">Kural 1: DCLK ve SYSREF aynı çipin aynı bölücü zincirinden çıkar; faz ilişkisi tasarım parametresidir (RF Örnekleme, SYSREF bölümü).</text>
<text x="20" y="348" class="s-kucuk">Kural 2: örnekleme saatini FPGA'dan üretme — fabric MMCM'in ps sınıfı jitter'ı 1.8 GHz girişte SNR'ı 40 dB'nin altına iter (Bölüm 9, F. jitter).</text>
</svg>