<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g82">
<title id="t-g82">Anti-alias filtrenin bölge seçimindeki rolü, iki plan yan yana. Üstte iyi plan: 300 MHz'lik bant 2. bölgenin ortasında (1650–1950 MHz), AAF geçiş bantları bölge sınırlarına 450 MHz uzakta, komşu bölgelerden katlanan gürültü ve spur'lar bandın dışına düşer. Altta kötü plan: bant 2100–2400 MHz, bölge sınırına yaslanmış; AAF'nin geçiş bandı 3. bölgeye taşar ve 3. bölgenin gürültüsü katlanıp bandın üst kenarına biner. Sağ panellerde ADC çıkışı (0–fs/2).</title>
<text x="60" y="72" class="s-baslik">İyi plan: bant bölgenin ortasında</text>
