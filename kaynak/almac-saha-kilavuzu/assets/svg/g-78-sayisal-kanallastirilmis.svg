<rect x="20.0" y="174.0" width="820.0" height="74.0" rx="6" class="blok" opacity=".8"/>
<text x="30.0" y="192.0" text-anchor="start" class="s-kucuk">M-5'in sayısal ikizi: N kanal bir kez tasarlanır, filtre şekli her kanalda birebir aynıdır (analogda imkânsız). Kanal başına hassasiyet dar banda göre, POI ≈ %100,</text>
<text x="30.0" y="208.0" text-anchor="start" class="s-kucuk">eşzamanlı sinyal kanal sayısı kadar. FFT çıkışının her bin'i bir kanal; polyphase FIR, düz FFT'nin spektral sızıntısını (leakage) ve kenar 'tavşan kulaklarını' düzeltir.</text>
<text x="30.0" y="224.0" text-anchor="start" class="s-kucuk">Karmaşıklığı en yüksek mimari: bellek, DSP slice ve kanal-arası mantık (aynı darbe komşu kanallarda). Bölüm 17 (kanallaştırma) ve 18 (FFT) ayrıntıyı verir.</text>
<text x="30.0" y="240.0" text-anchor="start" class="s-kucuk s-altin">Referans zincirin tek kanallı DDC'si bu yapının M = 1 halidir.</text>
</svg>