<svg viewBox="0 0 860 246" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g78">
<title id="t-g78">M-9 sayısal kanallaştırılmış almaç blok şeması: anten → LNA → BPF → geniş bant ADC → seri-paralel komütatör → polyphase FIR bankası → M-nokta FFT → M kanal → kanal başına zarf ve CFAR. Not: analog filtre bankasının sayısal ikizi, en yüksek karmaşıklık.</title>
<text x="20.0" y="24.0" text-anchor="start" class="s-baslik">M-9 · Sayısal kanallaştırılmış almaç — polyphase filtre bankası + FFT: N kanal, tek ADC</text>
