<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g7b">
<title id="t-g7b">Analog–sayısal sınırın kayması: sekiz durak (anten, LNA/RF, mixer+IF, kanal seçimi, zarf, eşik, ölçüm, PDW) beş mimari için altın (analog) veya mavi (sayısal) kutularla; kırmızı çizgi ADC'nin yeri — CVR ve süperhette zarftan sonra, sayısal IF'te IF'te, direct RF ve sayısal kanallaştırılmışta LNA'dan hemen sonra.</title>
<text x="20.0" y="22.0" text-anchor="start" class="s-baslik">Analog–sayısal sınır nereye kaydı? Aynı sekiz durak, beş mimari; kırmızı çizgi ADC'nin yeri</text>
<text x="271.0" y="46.0" text-anchor="middle" class="s-kucuk">anten</text>
<text x="353.0" y="46.0" text-anchor="middle" class="s-kucuk">LNA / RF</text>
<text x="435.0" y="46.0" text-anchor="middle" class="s-kucuk">mixer + IF</text>
<text x="517.0" y="46.0" text-anchor="middle" class="s-kucuk">kanal seçimi</text>
<text x="599.0" y="46.0" text-anchor="middle" class="s-kucuk">zarf / dedektör</text>
<text x="681.0" y="46.0" text-anchor="middle" class="s-kucuk">eşik</text>
<text x="763.0" y="46.0" text-anchor="middle" class="s-kucuk">ölçüm</text>
<text x="845.0" y="46.0" text-anchor="middle" class="s-kucuk">PDW</text>
<text x="220.0" y="80.0" text-anchor="end" class="s-metin">CVR (M-1)</text>

