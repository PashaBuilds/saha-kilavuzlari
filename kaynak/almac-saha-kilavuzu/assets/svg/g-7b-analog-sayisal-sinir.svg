<text x="517.0" y="376.0" text-anchor="middle" class="s-kucuk s-kirmizi">sınır sola kaydıkça: analog blok azalır, ADC hızı ve FPGA yükü artar, esneklik ve tekrarlanabilirlik artar</text>
<text x="20.0" y="372.0" text-anchor="start" class="s-kucuk">Altın: analog durak. Mavi: sayısal durak. Her sağa-sol adım, bir analog tasarım problemini (filtre, mixer, dedektör) bir DSP problemine çevirir — bu kılavuzun Kısım III–VIII'i o problemlerdir.</text>
