<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g61">
<title id="t-g61">Image problemi: (1) low-side LO 7.6 GHz ile RF 9.4 GHz ve image 5.8 GHz LO'nun iki yanında eşit uzaklıkta, preselector bandı 8–11 GHz altın kesikli; (2) IF ekseninde ikisi de 1.8 GHz'e düşer; (3) high-side LO 11.2 GHz ile image 13.0 GHz'e taşınır ve IF spektrumu evrilir — asimetrik rampa şekli ters döner.</title>
<text x="60.0" y="30.0" text-anchor="start" class="s-baslik">① Low-side LO (referans): image, LO'nun öbür yanında, IF kadar uzakta — preselector onu bastırmalı</text>
