<svg viewBox="0 0 860 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g71">
<title id="t-g71">M-2 süperheterodin blok şeması: anten → ayarlı preselector → LNA → mixer 1 (taramalı LO₁) → yüksek ilk IF filtresi → mixer 2 (sabit LO₂) → dar ikinci IF filtresi → IF/log yükselteç → dedektör; tarama kontrol register'ı yeşil. Not: dar anlık bant, düşük POI, en iyi hassasiyet.</title>
<text x="20.0" y="24.0" text-anchor="start" class="s-baslik">M-2 · Süperheterodin (taramalı, çift dönüşüm) — dar pencere, yüksek hassasiyet</text>
