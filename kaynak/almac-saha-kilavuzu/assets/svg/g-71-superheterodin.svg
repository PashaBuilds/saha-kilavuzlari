<rect x="20.0" y="200.0" width="820.0" height="44.0" rx="6" class="blok" opacity=".8"/>
<text x="30.0" y="218.0" text-anchor="start" class="s-kucuk">Anlık bant IF₂ filtresi kadar dardır; bandı LO₁ ile taramak gerekir → POI düşer. Karşılığında en iyi hassasiyet ve seçicilik, temiz dinamik aralık.</text>
<text x="30.0" y="234.0" text-anchor="start" class="s-kucuk">İlk IF yüksek (image uzak, preselector kolay), ikinci IF düşük (dar filtre kolay): çift dönüşümün klasik gerekçesi (Bölüm 6).</text>
</svg>