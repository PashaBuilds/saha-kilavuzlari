<title id="t-g81">Referans senaryonun katlanma haritası: üstte gerçek frekans ekseni (0–6 GHz) üzerinde Nyquist bölgeleri, IF bandı 1650–1950 MHz, HD2 bandı 3300–3900 MHz, HD3 bandı 4950–5850 MHz ve image 5.8 GHz; altta ADC çıkışında 1. bölgeye (0–1200 MHz) katlanmış halleri: sinyal 450–750 MHz evrik, HD2 900–1200 MHz, HD3 150–1050 MHz sinyalin üstüne biner, image AAF ile bastırılmazsa 1000 MHz</title>
