<text x="150.0" y="113.0" text-anchor="middle" class="s-kucuk">BPF</text>
<path d="M180.0 80.0 L220.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-amp" x="220.0" y="60.0" width="60" height="40"/>
<text x="250.0" y="113.0" text-anchor="middle" class="s-kucuk">LNA</text>
<path d="M280.0 80.0 L320.0 80.0" class="yol-analog" fill="none"/>
<path d="M320.0 80.0 L320.0 40.0" class="yol-analog" fill="none"/>
<path d="M320.0 80.0 L320.0 130.0" class="yol-analog" fill="none"/>
<path d="M320.0 40.0 L360.0 40.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<path d="M320.0 130.0 L360.0 130.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-mixer" x="360.0" y="20.0" width="60" height="40"/>
<use href="#sym-mixer" x="360.0" y="110.0" width="60" height="40"/>
<use href="#sym-lo" x="360.0" y="175.0" width="60" height="40"/>
<text x="390.0" y="228.0" text-anchor="middle" class="s-kucuk">LO = f_RF</text>
<path d="M390.0 175.0 L390.0 150.0" class="yol-saat" fill="none" marker-end="url(#ok-saat)"/>
<rect x="440.0" y="168.0" width="48.0" height="26.0" rx="4" class="blok"/>
<text x="464.0" y="185.0" text-anchor="middle" class="s-mono2">0° / 90°</text>
<path d="M390.0 110.0 L390.0 60.0" class="yol-saat" fill="none"/>
<text x="398.0" y="92.0" text-anchor="start" class="s-kucuk">90°</text>
<path d="M420.0 40.0 L460.0 40.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-lpf" x="460.0" y="20.0" width="60" height="40"/>
<text x="490.0" y="73.0" text-anchor="middle" class="s-kucuk">LPF (I)</text>
<text x="490.0" y="85.0" text-anchor="middle" class="s-mono2">baseband</text>
<path d="M520.0 40.0 L560.0 40.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-amp" x="560.0" y="20.0" width="60" height="40"/>
<text x="590.0" y="73.0" text-anchor="middle" class="s-kucuk">VGA</text>
<path d="M620.0 40.0 L660.0 40.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="660.0" y="20.0" width="60" height="40"/>
<text x="690.0" y="73.0" text-anchor="middle" class="s-kucuk">ADC I</text>
<text x="690.0" y="85.0" text-anchor="middle" class="s-mono2">düşük fs</text>
<path d="M720.0 40.0 L760.0 40.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<text x="764.0" y="44.0" text-anchor="start" class="s-mono s-vurgu">I[n]</text>
<path d="M420.0 130.0 L460.0 130.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-lpf" x="460.0" y="110.0" width="60" height="40"/>
<text x="490.0" y="163.0" text-anchor="middle" class="s-kucuk">LPF (Q)</text>
<text x="490.0" y="175.0" text-anchor="middle" class="s-mono2">baseband</text>
<path d="M520.0 130.0 L560.0 130.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-amp" x="560.0" y="110.0" width="60" height="40"/>
<text x="590.0" y="163.0" text-anchor="middle" class="s-kucuk">VGA</text>
<path d="M620.0 130.0 L660.0 130.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="660.0" y="110.0" width="60" height="40"/>
<text x="690.0" y="163.0" text-anchor="middle" class="s-kucuk">ADC Q</text>
<text x="690.0" y="175.0" text-anchor="middle" class="s-mono2">düşük fs</text>
<path d="M720.0 130.0 L760.0 130.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<text x="764.0" y="134.0" text-anchor="start" class="s-mono s-vurgu">Q[n]</text>
<rect x="20.0" y="218.0" width="820.0" height="58.0" rx="6" class="blok" opacity=".8"/>
<text x="30.0" y="236.0" text-anchor="start" class="s-kucuk">Image problemi yok (image = sinyalin kendisi) ama üç yeni dert: DC ofset (LO kendi kendine karışır), I/Q dengesizliği (bir 'iç image' üretir) ve LO sızıntısı.</text>
<text x="30.0" y="252.0" text-anchor="start" class="s-kucuk">1/f gürültüsü baseband'de sinyalin üstüne biner. Entegre alıcılarda (tek çip) standarttır; sayısal I/Q düzeltme ile EH bantlarına da girer.</text>
<text x="30.0" y="268.0" text-anchor="start" class="s-kucuk">Kırmızı olmayan iki yol da analog (altın): I ve Q ayrı ADC'lerle örneklenir — ADC hızı yalnızca sinyal bandı kadar.</text>
</svg>