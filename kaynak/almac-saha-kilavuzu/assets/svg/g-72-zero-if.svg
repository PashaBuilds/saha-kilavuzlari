<svg viewBox="0 0 860 288" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g72">
<title id="t-g72">M-3 zero-IF/homodyne blok şeması: anten → BPF → LNA → iki mixer (LO = RF, 0° ve 90° faz) → baseband LPF → VGA → iki ADC → I[n] ve Q[n]. Not: image yok, ama DC ofset, I/Q dengesizliği ve LO sızıntısı.</title>
<text x="20.0" y="24.0" text-anchor="start" class="s-baslik">M-3 · Zero-IF / homodyne — LO = RF, doğrudan baseband I/Q</text>
<use href="#sym-anten" x="20.0" y="60.0" width="60" height="40"/>
<text x="50.0" y="113.0" text-anchor="middle" class="s-kucuk">anten</text>
<path d="M80.0 80.0 L120.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
