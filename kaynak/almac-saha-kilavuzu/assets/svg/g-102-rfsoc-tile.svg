<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g102">
<title id="t-g102">RFSoC RF-ADC tile yapısı, jenerik gösterim: bir tile içinde birden çok RF-ADC bloğu; her blokta ADC çekirdeği, eşik dedektörü, QMC/ofset düzeltme, NCO'lu kompleks mixer, decimation ve FIFO; çıkış PL'ye AXI-Stream ile sabit genişlikte paralel örnek sözcükleri olarak gider. Tile ortak kaynakları: giriş saati, çip içi PLL, SYSREF girişi ve çok tile senkronizasyonu. PS, RF Data Converter sürücüsü ile AXI-Lite üzerinden yapılandırır. Blok sayısı ve adlar nesle göre değişir; bkz. PG269.</title>
<text x="20" y="24" class="s-baslik">RFSoC RF-ADC tile — jenerik yapı (aynı silikonda: RF-ADC + PL + PS)</text>
<rect x="20" y="40" width="700" height="290" rx="10" class="blok" opacity=".35"/>
<text x="30" y="58" class="s-metin2">ADC tile</text>
<rect x="40" y="70" width="660" height="100" rx="6" class="blok"/>
<text x="48" y="84" class="s-kucuk">RF-ADC blok 0</text>
<text x="14" y="129" class="s-kucuk s-altin">RF0</text>
<path d="M40.0 125.0 L58.0 125.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="60" y="105" width="60" height="40"/><text x="90.0" y="158" text-anchor="middle" class="s-kucuk">ADC çekirdeği</text>
<path d="M120.0 125.0 L138.0 125.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="140" y="107" width="66" height="36" rx="4" class="blok-aktif"/><text x="173.0" y="122.0" text-anchor="middle" class="s-metin2">eşik / QMC</text><text x="173.0" y="136.0" text-anchor="middle" class="s-kucuk">ofset-kazanç</text>
<path d="M206.0 125.0 L224.0 125.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-mixer-d" x="226" y="105" width="60" height="40"/><text x="256.0" y="158" text-anchor="middle" class="s-kucuk">mixer</text>
<use href="#sym-nco" x="300" y="147" width="50" height="22"/>
<path d="M300 158 H262 V145" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<text x="354" y="163" class="s-kucuk">NCO (48 bit FTW)</text>
<path d="M286.0 125.0 L304.0 125.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-dec" x="306" y="105" width="60" height="40"/><text x="336.0" y="158" text-anchor="middle" class="s-kucuk">decimation</text>
<path d="M366.0 125.0 L384.0 125.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fifo" x="386" y="105" width="60" height="40"/><text x="416.0" y="158" text-anchor="middle" class="s-kucuk">FIFO</text>
<path d="M446.0 125.0 L464.0 125.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="466" y="107" width="110" height="36" rx="4" class="blok-aktif"/><text x="521.0" y="122.0" text-anchor="middle" class="s-metin2">AXI-Stream</text><text x="521.0" y="136.0" text-anchor="middle" class="s-kucuk">N örnek/saat, 16 bit</text>
<path d="M576 125 H760" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<text x="600" y="119" class="s-kucuk">tdata[16·N−1:0], tvalid</text>
<text x="600" y="139" class="s-kucuk">reel ya da I/Q (mixer moduna göre)</text>
<rect x="40" y="190" width="660" height="100" rx="6" class="blok"/>
<text x="48" y="204" class="s-kucuk">RF-ADC blok 1</text>
<text x="14" y="249" class="s-kucuk s-altin">RF1</text>
<path d="M40.0 245.0 L58.0 245.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="60" y="225" width="60" height="40"/><text x="90.0" y="278" text-anchor="middle" class="s-kucuk">ADC çekirdeği</text>
<path d="M120.0 245.0 L138.0 245.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="140" y="227" width="66" height="36" rx="4" class="blok-aktif"/><text x="173.0" y="242.0" text-anchor="middle" class="s-metin2">eşik / QMC</text><text x="173.0" y="256.0" text-anchor="middle" class="s-kucuk">ofset-kazanç</text>
<path d="M206.0 245.0 L224.0 245.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-mixer-d" x="226" y="225" width="60" height="40"/><text x="256.0" y="278" text-anchor="middle" class="s-kucuk">mixer</text>
<use href="#sym-nco" x="300" y="267" width="50" height="22"/>
<path d="M300 278 H262 V265" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<text x="354" y="283" class="s-kucuk">NCO (48 bit FTW)</text>
<path d="M286.0 245.0 L304.0 245.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-dec" x="306" y="225" width="60" height="40"/><text x="336.0" y="278" text-anchor="middle" class="s-kucuk">decimation</text>
<path d="M366.0 245.0 L384.0 245.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fifo" x="386" y="225" width="60" height="40"/><text x="416.0" y="278" text-anchor="middle" class="s-kucuk">FIFO</text>
<path d="M446.0 245.0 L464.0 245.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="466" y="227" width="110" height="36" rx="4" class="blok-aktif"/><text x="521.0" y="242.0" text-anchor="middle" class="s-metin2">AXI-Stream</text><text x="521.0" y="256.0" text-anchor="middle" class="s-kucuk">N örnek/saat, 16 bit</text>
<path d="M576 245 H760" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<text x="600" y="239" class="s-kucuk">tdata[16·N−1:0], tvalid</text>
<text x="600" y="259" class="s-kucuk">reel ya da I/Q (mixer moduna göre)</text>
<rect x="40" y="290" width="660" height="34" rx="6" class="blok"/>
<text x="48" y="311" class="s-kucuk">tile ortak: </text>
<use href="#sym-saat" x="110" y="293" width="40" height="28"/>
<text x="156" y="311" class="s-kucuk">ADC_CLK girişi → PLL/bölücü → örnekleme saati</text>
<text x="430" y="311" class="s-kucuk">SYSREF girişi · çok tile senkron (MTS)</text>
<path d="M110 290 V270" class="yol-saat"/><path d="M110 270 H90 V110" class="yol-saat" marker-end="url(#ok-saat)"/>
<path d="M90 230 H90" class="yol-saat"/><path d="M90 200 V230" class="yol-saat" marker-end="url(#ok-saat)"/>
<rect x="770" y="40" width="210" height="130" rx="8" class="blok-aktif" opacity=".7"/>
<text x="875" y="66" text-anchor="middle" class="s-metin2 s-vurgu">PL (FPGA kumaşı)</text>
<text x="875" y="86" text-anchor="middle" class="s-kucuk">DDC devamı · kanallaştırma</text>
<text x="875" y="102" text-anchor="middle" class="s-kucuk">FFT · tespit · PDW (Kısım V–VIII)</text>
<text x="875" y="122" text-anchor="middle" class="s-kucuk">saat: AXI-Stream çıkış saati</text>
<text x="875" y="138" text-anchor="middle" class="s-kucuk">(fs / N, ör. 300 MHz için N = 8)</text>
<rect x="770" y="220" width="210" height="110" rx="8" class="blok-kontrol"/>
<text x="875" y="246" text-anchor="middle" class="s-metin2 s-yesil">PS (Arm çekirdekleri)</text>
<text x="875" y="266" text-anchor="middle" class="s-kucuk">RF Data Converter sürücüsü</text>
<text x="875" y="282" text-anchor="middle" class="s-kucuk">NCO frekansı · decimation · eşik</text>
<text x="875" y="298" text-anchor="middle" class="s-kucuk">kalibrasyon · MTS · durum</text>
<path d="M770 275 H720 V200 H700" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<text x="726" y="250" class="s-kucuk s-yesil" transform="rotate(-90 726 250)">AXI-Lite</text>
<path d="M875 170 V220" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<text x="882" y="200" class="s-kucuk s-yesil">AXI / DMA</text>
<text x="20" y="376" class="s-kucuk">Referans senaryo eşlemesi: RF0 ← IF 1800 MHz, fs 2400 MSPS, mixer NCO 600 MHz, decimation ÷8 → PL'ye 300 MSPS I/Q.</text>
<text x="20" y="392" class="s-kucuk">Jenerik şema; blok sayısı, bit genişliği ve özellikler nesle/ürüne göre değişir — güncel ürün kılavuzuna bakın (doğrulanmadı).</text>
</svg>