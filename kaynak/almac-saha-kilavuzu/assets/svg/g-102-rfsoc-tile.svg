<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g102">
<title id="t-g102">RFSoC RF-ADC tile yapısı, jenerik gösterim: bir tile içinde birden çok RF-ADC bloğu; her blokta ADC çekirdeği, eşik dedektörü, QMC/ofset düzeltme, NCO'lu kompleks mixer, decimation ve FIFO; çıkış PL'ye AXI-Stream ile sabit genişlikte paralel örnek sözcükleri olarak gider. Tile ortak kaynakları: giriş saati, çip içi PLL, SYSREF girişi ve çok tile senkronizasyonu. PS, RF Data Converter sürücüsü ile AXI-Lite üzerinden yapılandırır. Blok sayısı ve adlar nesle göre değişir; bkz. PG269.</title>
<text x="20" y="24" class="s-baslik">RFSoC RF-ADC tile — jenerik yapı (aynı silikonda: RF-ADC + PL + PS)</text>
<rect x="20" y="40" width="700" height="332" rx="10" class="blok" opacity=".35"/>
<text x="30" y="58" class="s-metin2">ADC tile</text>
<rect x="40" y="70" width="660" height="116" rx="6" class="blok"/>
<text x="48" y="84" class="s-kucuk">RF-ADC blok 0</text>
<text x="4" y="132" class="s-kucuk s-altin">RF0</text>
<path d="M40.0 128.0 L58.0 128.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="60" y="108" width="60" height="40"/>
<text x="90" y="102" text-anchor="middle" class="s-kucuk">ADC çekirdeği</text>
<path d="M30 158 H90 V150" class="yol-saat" fill="none" marker-end="url(#ok-saat)"/>
<path d="M120.0 128.0 L138.0 128.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="140" y="110" width="66" height="36" rx="4" class="blok-aktif"/><text x="173.0" y="125.0" text-anchor="middle" class="s-metin2">eşik / QMC</text><text x="173.0" y="139.0" text-anchor="middle" class="s-kucuk">ofset-kazanç</text>
<path d="M206.0 128.0 L224.0 128.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-mixer-d" x="226" y="108" width="60" height="40"/>
<text x="256" y="102" text-anchor="middle" class="s-kucuk">mixer</text>
<use href="#sym-nco" x="231" y="164" width="50" height="22"/>
<path d="M256 164 V150" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<text x="287" y="179" class="s-kucuk">NCO (48 bit FTW)</text>
<path d="M286.0 128.0 L304.0 128.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-dec" x="306" y="108" width="60" height="40"/><text x="336.0" y="161" text-anchor="middle" class="s-kucuk">decimation</text>
<path d="M366.0 128.0 L384.0 128.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fifo" x="386" y="108" width="60" height="40"/><text x="416.0" y="161" text-anchor="middle" class="s-kucuk">FIFO</text>
<path d="M446.0 128.0 L464.0 128.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="466" y="110" width="110" height="36" rx="4" class="blok-aktif"/><text x="521.0" y="125.0" text-anchor="middle" class="s-metin2">AXI-Stream</text><text x="521.0" y="139.0" text-anchor="middle" class="s-kucuk">N örnek/saat, 16 bit</text>
<path d="M576 128 H760" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<text x="600" y="122" class="s-kucuk">tdata[16·N−1:0], tvalid</text>
<text x="600" y="142" class="s-kucuk">reel ya da I/Q (mixer modu)</text>
<rect x="40" y="202" width="660" height="116" rx="6" class="blok"/>
<text x="48" y="216" class="s-kucuk">RF-ADC blok 1</text>
<text x="4" y="264" class="s-kucuk s-altin">RF1</text>
<path d="M40.0 260.0 L58.0 260.0" class="yol-analog" marker-end="url(#ok-analog)"/>
<use href="#sym-adc" x="60" y="240" width="60" height="40"/>
<text x="90" y="234" text-anchor="middle" class="s-kucuk">ADC çekirdeği</text>
<path d="M30 290 H90 V282" class="yol-saat" fill="none" marker-end="url(#ok-saat)"/>
<path d="M120.0 260.0 L138.0 260.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="140" y="242" width="66" height="36" rx="4" class="blok-aktif"/><text x="173.0" y="257.0" text-anchor="middle" class="s-metin2">eşik / QMC</text><text x="173.0" y="271.0" text-anchor="middle" class="s-kucuk">ofset-kazanç</text>
<path d="M206.0 260.0 L224.0 260.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-mixer-d" x="226" y="240" width="60" height="40"/>
<text x="256" y="234" text-anchor="middle" class="s-kucuk">mixer</text>
<use href="#sym-nco" x="231" y="296" width="50" height="22"/>
<path d="M256 296 V282" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<text x="287" y="311" class="s-kucuk">NCO (48 bit FTW)</text>
<path d="M286.0 260.0 L304.0 260.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-dec" x="306" y="240" width="60" height="40"/><text x="336.0" y="293" text-anchor="middle" class="s-kucuk">decimation</text>
<path d="M366.0 260.0 L384.0 260.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fifo" x="386" y="240" width="60" height="40"/><text x="416.0" y="293" text-anchor="middle" class="s-kucuk">FIFO</text>
<path d="M446.0 260.0 L464.0 260.0" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<rect x="466" y="242" width="110" height="36" rx="4" class="blok-aktif"/><text x="521.0" y="257.0" text-anchor="middle" class="s-metin2">AXI-Stream</text><text x="521.0" y="271.0" text-anchor="middle" class="s-kucuk">N örnek/saat, 16 bit</text>
<path d="M576 260 H760" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<text x="600" y="254" class="s-kucuk">tdata[16·N−1:0], tvalid</text>
<text x="600" y="274" class="s-kucuk">reel ya da I/Q (mixer modu)</text>
<rect x="40" y="330" width="660" height="34" rx="6" class="blok"/>
<text x="48" y="351" class="s-kucuk">tile ortak: </text>
<use href="#sym-saat" x="110" y="333" width="40" height="28"/>
<text x="156" y="351" class="s-kucuk">ADC_CLK girişi → PLL/bölücü → örnekleme saati</text>
<text x="430" y="351" class="s-kucuk">SYSREF girişi · çok tile senkron (MTS)</text>
<path d="M110 330 V322 H30 V158" class="yol-saat" fill="none"/>
<rect x="770" y="40" width="210" height="130" rx="8" class="blok-aktif" opacity=".7"/>
<text x="875" y="66" text-anchor="middle" class="s-metin2 s-vurgu">PL (FPGA kumaşı)</text>
<text x="875" y="86" text-anchor="middle" class="s-kucuk">DDC devamı · kanallaştırma</text>
<text x="875" y="102" text-anchor="middle" class="s-kucuk">FFT · tespit · PDW (Kısım V–VIII)</text>
<text x="875" y="122" text-anchor="middle" class="s-kucuk">saat: AXI-Stream çıkış saati</text>
<text x="875" y="138" text-anchor="middle" class="s-kucuk">(fs / N, ör. 300 MHz için N = 8)</text>
<rect x="770" y="240" width="210" height="110" rx="8" class="blok-kontrol"/>
<text x="875" y="266" text-anchor="middle" class="s-metin2 s-yesil">PS (Arm çekirdekleri)</text>
<text x="875" y="286" text-anchor="middle" class="s-kucuk">RF Data Converter sürücüsü</text>
<text x="875" y="302" text-anchor="middle" class="s-kucuk">NCO frekansı · decimation · eşik</text>
<text x="875" y="318" text-anchor="middle" class="s-kucuk">kalibrasyon · MTS · durum</text>
<path d="M770 300 H720 V212 H700" class="yol-kontrol" fill="none" marker-end="url(#ok-kontrol)"/>
<text x="740" y="292" class="s-kucuk s-yesil" transform="rotate(-90 740 292)">AXI-Lite</text>
<path d="M875 170 V240" class="yol-kontrol" marker-end="url(#ok-kontrol)"/>
<text x="882" y="208" class="s-kucuk s-yesil">AXI / DMA</text>
<text x="20" y="416" class="s-kucuk">Referans senaryo eşlemesi: RF0 ← IF 1800 MHz, fs 2400 MSPS, mixer NCO 600 MHz, decimation ÷8 → PL'ye 300 MSPS I/Q.</text>
<text x="20" y="432" class="s-kucuk">Jenerik şema; blok sayısı, bit genişliği ve özellikler nesle/ürüne göre değişir — güncel ürün kılavuzuna bakın (doğrulanmadı).</text>
</svg>