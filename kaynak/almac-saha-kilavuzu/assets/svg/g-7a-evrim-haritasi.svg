<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g7a">
<title id="t-g7a">Almaç mimarilerinin tarihsel/evrimsel haritası: 1940'lardan 2020'lere dört soy (zarf, anlık frekans, süperhet, kanallaştırma) üzerinde on mimari; CVR→IFM, süperhet→sayısal IF→direct RF, analog kanallaştırılmış ve compressive→sayısal kanallaştırılmış, IFM→monobit evrim okları; 1990 sonrası hızlı ADC + FPGA çağı vurgulu.</title>
<text x="60.0" y="22.0" text-anchor="start" class="s-baslik">Almaç mimarilerinin evrim haritası (yaklaşık on yıllar; açık literatüre göre, ± bir on yıl)</text>
