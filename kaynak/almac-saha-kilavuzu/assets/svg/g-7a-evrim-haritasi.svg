<text x="579.9" y="248.0" text-anchor="start" class="s-kucuk">sayısal IF</text>
<rect x="633.2" y="140.0" width="70.0" height="34.0" rx="6" class="blok"/>
<text x="639.2" y="154.0" text-anchor="start" class="s-mono2">M-10</text>
<text x="639.2" y="168.0" text-anchor="start" class="s-kucuk">monobit</text>
<rect x="652.9" y="300.0" width="140.0" height="34.0" rx="6" class="blok"/>
<text x="658.9" y="314.0" text-anchor="start" class="s-mono2">M-9</text>
<text x="658.9" y="328.0" text-anchor="start" class="s-kucuk">sayısal kanallaştırılmış</text>
<rect x="771.5" y="220.0" width="110.0" height="34.0" rx="6" class="blok"/>
