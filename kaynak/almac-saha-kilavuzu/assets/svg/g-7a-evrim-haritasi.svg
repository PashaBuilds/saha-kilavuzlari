<text x="722.7" y="228.0" text-anchor="middle" class="s-kucuk">ADC RF'e</text>
<path d="M466.7 317 C506.7 317 612.9 317 652.9 317" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)" opacity=".9"/>
<text x="559.8" y="308.0" text-anchor="middle" class="s-kucuk">filtre bankası → FFT</text>
<path d="M526.2 157 C566.2 157 612.9 317 652.9 317" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)" opacity=".9"/>
<text x="589.6" y="228.0" text-anchor="middle" class="s-kucuk">analog Fourier → sayısal</text>
<path d="M298.0 157 C338.0 157 593.2 157 633.2 157" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)" opacity=".9"/>
<text x="465.6" y="148.0" text-anchor="middle" class="s-kucuk">1-bit FFT</text>
<path d="M259.4 237 C299.4 237 494.4 237 534.4 237" class="yol-analog" fill="none" marker-end="url(#ok-analog)" opacity=".9"/>
<text x="396.9" y="228.0" text-anchor="middle" class="s-kucuk">IF = 0</text>
<rect x="554.1" y="40" width="345.9" height="370" class="spk-sinyal" opacity=".06"/>
<text x="560.1" y="52.0" text-anchor="start" class="s-kucuk s-vurgu">hızlı ADC + FPGA çağı →</text>
<text x="60.0" y="450.0" text-anchor="start" class="s-kucuk">Altın kutular analog, mavi kutular sayısal çekirdekli mimariler. Oklar 'hangi fikir hangisine dönüştü' ilişkisidir; tarihler kaynaklara göre ± bir on yıl oynar.</text>
<text x="60.0" y="464.0" text-anchor="start" class="s-kucuk">Bugün RWR'lerde M-1 + M-4 ikilisi, ESM/ELINT'te M-7/M-8 + M-9 yaygındır; M-6 ve akusto-optik tarihî ilgi alanıdır.</text>
</svg>