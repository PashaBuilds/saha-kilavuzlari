<text x="356.5" y="424.0" text-anchor="middle" class="s-mono2">1970</text>
<line x1="455.3" y1="40" x2="455.3" y2="410" class="izgara"/>
<text x="455.3" y="424.0" text-anchor="middle" class="s-mono2">1980</text>
<line x1="554.1" y1="40" x2="554.1" y2="410" class="izgara"/>
<text x="554.1" y="424.0" text-anchor="middle" class="s-mono2">1990</text>
<line x1="652.9" y1="40" x2="652.9" y2="410" class="izgara"/>
<text x="652.9" y="424.0" text-anchor="middle" class="s-mono2">2000</text>
<line x1="751.8" y1="40" x2="751.8" y2="410" class="izgara"/>
<text x="751.8" y="424.0" text-anchor="middle" class="s-mono2">2010</text>
<line x1="850.6" y1="40" x2="850.6" y2="410" class="izgara"/>
<text x="850.6" y="424.0" text-anchor="middle" class="s-mono2">2020</text>
<text x="64.0" y="52.0" text-anchor="start" class="s-kucuk s-altin">zarf soyu</text>
