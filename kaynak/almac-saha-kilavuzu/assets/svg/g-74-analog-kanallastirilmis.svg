<title id="t-g74">M-5 analog kanallaştırılmış almaç blok şeması: anten → LNA → güç bölücü → N paralel kanal (BPF → dedektör → video yükselteç → eşik) → kodlayıcı/öncelik mantığı → kanal numarası. Not: eşzamanlı sinyal ve POI yüksek, hacim ve maliyet yüksek.</title>
