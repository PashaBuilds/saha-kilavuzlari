<rect x="20.0" y="296.0" width="820.0" height="44.0" rx="6" class="blok" opacity=".8"/>
<text x="30.0" y="314.0" text-anchor="start" class="s-kucuk">N kanal aynı anda dinler: eşzamanlı sinyal başarımı ve POI yüksek, hassasiyet kanal bandına göre (dar kanal → iyi). Bedel: N adet filtre + dedektör → hacim, güç, maliyet.</text>
<text x="30.0" y="330.0" text-anchor="start" class="s-kucuk">Kanal kenarındaki sinyal iki kanalda birden görünür ('rabbit ears'); frekans doğruluğu kanal genişliğiyle sınırlı. Sayısal karşılığı M-9.</text>
