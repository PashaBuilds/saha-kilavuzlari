<path d="M780.0 106.9 V65.7" class="yol-gurultu" marker-end="url(#ok-gurultu)"/>
<text x="786.0" y="86.9" text-anchor="start" class="s-kucuk s-kirmizi">16 dB taşma</text>
<text x="786.0" y="99.9" text-anchor="start" class="s-kucuk s-kirmizi">→ zayıflatıcı</text>
<text x="24.0" y="220.0" text-anchor="middle" class="s-kucuk" transform="rotate(-90 24 220.0)">seviye (dBm)</text>
<text x="70.0" y="480.0" text-anchor="start" class="s-kucuk">Friis ile zincir NF = 3.45 dB (bütçe: 6 dB, Bölüm 4). Kurgusal IP3 bütçesiyle zincir IIP3 ≈ -6.6 dBm; tavan ADC tam ölçeği: giriş -36 dBm.</text>
<text x="70.0" y="498.0" text-anchor="start" class="s-kucuk">Gri: gürültü tabanı (kTB + NF_kum + G_kum). Mavi: −60 dBm referans darbe. Altın: −20 dBm güçlü emiter — son katlar sıkışmadan ADC dolar.</text>
<text x="70.0" y="516.0" text-anchor="start" class="s-kucuk">Kırmızı çizgiler: blokların çıkış P1dB'si; sinyal bu çizgiye 3 dB'den fazla yaklaşınca IMD3 hızla büyür (eğim 3).</text>
<text x="70.0" y="534.0" text-anchor="start" class="s-kucuk">Anlık dinamik aralık ≈ ADC FS girişi (−36 dBm) − MDS (−83 dBm) ≈ 47 dB; zayıflatıcı adımlarıyla 'toplam' dinamik aralık 30 dB daha genişler.</text>
</svg>