<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g52">
<title id="t-g52">Seviye planı: referans senaryonun yedi bloklu RF zinciri boyunca sinyal (mavi, −60 dBm giriş), güçlü emiter (altın, −20 dBm) ve gürültü tabanı (gri, kTB + kümülatif NF + kümülatif kazanç, B = 300 MHz); her blok altında kazanç, NF, kümülatif NF ve kümülatif kazanç; kırmızı çizgiler blok çıkış P1dB'leri ve ADC tam ölçeği; çıkışta SNR oku ve güçlü sinyalin ADC'yi taşırma miktarı.</title>
<text x="70.0" y="22.0" text-anchor="start" class="s-baslik">Seviye planı (referans senaryo, kurgusal P1dB bütçesi) — B = 300 MHz</text>
<line x1="70" y1="65.7" x2="870" y2="65.7" class="izgara"/><text x="64.0" y="69.7" text-anchor="end" class="s-mono2">20</text>
