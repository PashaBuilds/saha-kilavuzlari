<text x="126.0" y="160.6" text-anchor="start" class="s-kucuk">güçlü emiter (-20 dBm giriş)</text>
<text x="126.0" y="360.6" text-anchor="start" class="s-kucuk">kTB = -89.2 dBm</text>
<text x="814.0" y="226.9" text-anchor="end" class="s-kucuk">-45.8 dBm (NF 3.45 + G 40)</text>
<line x1="302.0" y1="78.6" x2="338.0" y2="78.6" stroke="var(--red)" stroke-width="2.4"/>
<text x="342.0" y="82.6" text-anchor="start" class="s-kucuk s-kirmizi">OP1dB +15</text>
