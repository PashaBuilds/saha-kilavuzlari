<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g80">
<title id="t-g80">Nyquist bölgeleri ve katlanma, akordeon görünümü: üstte gerçek frekans ekseni 0–3·fs, altı bölgeye bölünmüş; her bölgede aynı asimetrik bant (alçak kenar A, yüksek kenar B). Altta eksen fs/2 katlarında akordeon gibi katlanır: tek bölgeler düz, çift bölgeler aynalı (A ile B yer değiştirir) olarak 0–fs/2 üzerine iner; en altta ADC çıkışında hepsinin üst üste bindiği tek bant. Referans senaryo: fs = 2400 MHz, IF 1800 MHz 2. bölgede, evrik.</title>
<text x="70" y="24" class="s-baslik">Gerçek frekans ekseni — bölgeler (n−1)·fs/2 … n·fs/2</text>
