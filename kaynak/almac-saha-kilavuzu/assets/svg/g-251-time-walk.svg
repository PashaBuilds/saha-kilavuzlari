<line x1="500" y1="182.2" x2="830" y2="182.2" class="yol-saat"/>
<text x="504.0" y="178.2" text-anchor="start" class="s-kucuk">1 örnek = 3.33 ns</text>
<text x="504.0" y="54.0" text-anchor="start" class="s-mono2">t_x = t_r/π · acos(1 − 2a)</text>
<text x="504.0" y="67.0" text-anchor="start" class="s-kucuk">a = genlik oranı, t_r = 50 ns</text>
<text x="70.0" y="250.0" text-anchor="start" class="s-metin2">Referans senaryo: eşik −68 dBm sabit. −60 dBm'lik darbe eşiği tepesinin −8 dB'sinde keser (21.7 ns), −40 dBm'lik darbe −28 dB'sinde (6.4 ns):</text>
<text x="70.0" y="270.0" text-anchor="start" class="s-metin2">aynı anda gelen iki darbenin TOA'sı 15.3 ns ≈ 4.6 örnek farklı okunur. Düzeltme: PA'ya bağlı tablo ya da %50 tepe noktasına göre TOA (kesirli).</text>
<text x="70.0" y="305.0" text-anchor="start" class="s-metin2">PW'ye etkisi (simetrik kenarlar): PW_ölçülen = PW_%50 + t_r − 2·t_x. Eşik tepenin −8 dB'sindeyse +6.6 ns, −28 dB'sindeyse +37.2 ns uzun okunur;</text>
<text x="70.0" y="325.0" text-anchor="start" class="s-metin2">histerezis düşen kenarı daha da geç kestirir (T_off = T_on − 3 dB → düşen kenarda birkaç ns daha).</text>
<text x="70.0" y="360.0" text-anchor="start" class="s-kucuk">Sayılar kosinüs kenarlı öğretici darbe modeline aittir; gerçek kenar şekli farklıysa eğri değişir, mekanizma değişmez.</text>
