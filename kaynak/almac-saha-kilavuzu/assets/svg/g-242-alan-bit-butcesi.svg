<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g242">
<title id="t-g242">Alan başına bit bütçesi: TOA 48, PW 20, PA 10, RF 20, AOA 12 ve meta 18 bit; her alanın LSB'si ve dinamik aralığı; toplam 128 bit</title>
<text x="30.0" y="24.0" text-anchor="start" class="s-baslik">bit = ⌈log2(aralık / çözünürlük)⌉ — alan başına bütçe ve 128 bitlik toplam</text>
<text x="82.0" y="66.0" text-anchor="end" class="s-mono">TOA</text>
<rect x="90" y="50" width="259.2" height="22" rx="3" class="blok-aktif"/>
<text x="219.6" y="65.0" text-anchor="middle" class="s-mono2">48 bit</text>
<text x="365.2" y="60.0" text-anchor="start" class="s-kucuk">LSB 3.333 ns</text>
<text x="365.2" y="72.0" text-anchor="start" class="s-kucuk">2^48 × 3.333 ns ≈ 10.9 gün (sarmadan)</text>
<text x="82.0" y="100.0" text-anchor="end" class="s-mono">PW</text>
<rect x="90" y="84" width="108.0" height="22" rx="3" class="blok-aktif"/>
<text x="144.0" y="99.0" text-anchor="middle" class="s-mono2">20 bit</text>
<text x="365.2" y="94.0" text-anchor="start" class="s-kucuk">LSB 3.333 ns</text>
<text x="365.2" y="106.0" text-anchor="start" class="s-kucuk">2^20 × 3.333 ns ≈ 3.5 ms</text>
<text x="82.0" y="134.0" text-anchor="end" class="s-mono">PA</text>
<rect x="90" y="118" width="54.0" height="22" rx="3" class="blok-aktif"/>
<text x="117.0" y="133.0" text-anchor="middle" class="s-mono2">10 bit</text>
<text x="365.2" y="128.0" text-anchor="start" class="s-kucuk">LSB 0.25 dB</text>
<text x="365.2" y="140.0" text-anchor="start" class="s-kucuk">1024 × 0.25 = 256 dB (log ölçek)</text>
<text x="82.0" y="168.0" text-anchor="end" class="s-mono">RF</text>
<rect x="90" y="152" width="108.0" height="22" rx="3" class="blok-aktif"/>
<text x="144.0" y="167.0" text-anchor="middle" class="s-mono2">20 bit</text>
<text x="365.2" y="162.0" text-anchor="start" class="s-kucuk">LSB 10 kHz</text>
<text x="365.2" y="174.0" text-anchor="start" class="s-kucuk">2^20 × 10 kHz ≈ 10.49 GHz (mutlak)</text>
<text x="82.0" y="202.0" text-anchor="end" class="s-mono">AOA</text>
<rect x="90" y="186" width="64.8" height="22" rx="3" class="blok-aktif"/>
<text x="122.4" y="201.0" text-anchor="middle" class="s-mono2">12 bit</text>
<text x="365.2" y="196.0" text-anchor="start" class="s-kucuk">LSB 0.1°</text>
<text x="365.2" y="208.0" text-anchor="start" class="s-kucuk">4096 × 0.1° = 409.6° ≥ 360°</text>
<text x="82.0" y="236.0" text-anchor="end" class="s-mono">meta</text>
<rect x="90" y="220" width="97.2" height="22" rx="3" class="blok-kontrol"/>
<text x="138.6" y="235.0" text-anchor="middle" class="s-mono2">18 bit</text>
<text x="365.2" y="230.0" text-anchor="start" class="s-kucuk">LSB —</text>
<text x="365.2" y="242.0" text-anchor="start" class="s-kucuk">FLAGS 6 · SEQ 8 · MOP 2 · CH 2</text>
<rect x="90.0" y="262" width="259.2" height="18" class="blok-aktif"/>
<text x="219.6" y="275.0" text-anchor="middle" class="s-kucuk">TOA</text>
<rect x="349.2" y="262" width="108.0" height="18" class="blok-aktif"/>
<text x="403.2" y="275.0" text-anchor="middle" class="s-kucuk">PW</text>
<rect x="457.2" y="262" width="54.0" height="18" class="blok-aktif"/>
<text x="484.2" y="275.0" text-anchor="middle" class="s-kucuk">PA</text>
<rect x="511.2" y="262" width="108.0" height="18" class="blok-aktif"/>
<text x="565.2" y="275.0" text-anchor="middle" class="s-kucuk">RF</text>
<rect x="619.2" y="262" width="64.8" height="18" class="blok-aktif"/>
<text x="651.6" y="275.0" text-anchor="middle" class="s-kucuk">AOA</text>
<rect x="684.0" y="262" width="97.2" height="18" class="blok-kontrol"/>
<text x="732.6" y="275.0" text-anchor="middle" class="s-kucuk">meta</text>
<text x="90.0" y="296.0" text-anchor="start" class="s-metin2">toplam 48 + 20 + 10 + 20 + 12 + 18 = 128 bit = 4 × 32-bit sözcük — kurgusal, öğretici</text>
</svg>
