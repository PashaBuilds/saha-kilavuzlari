<svg viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g20">
<title id="t-g20">Dönen fazör ve I/Q izdüşümleri. Solda birim çember üzerinde saat yönünün tersine dönen e^{jθ} vektörü; yatay izdüşümü I = cos θ, düşey izdüşümü Q = sin θ; ilk sekiz örnek noktalanmış. Sağda aynı örneklerin zamanda I(t) ve Q(t) olarak açılmış hali: Q, I'yı 90° geriden izler. Altta reel kosinüsün iki ters dönen fazörün toplamı olduğu (pozitif ve negatif frekans) gösterilir.</title>
