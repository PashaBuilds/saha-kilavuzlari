<svg viewBox="0 0 1010 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g110">
<title id="t-g110">JESD204 özet: solda ADC (TX) ve FPGA (RX) tarafında aynalı dört katman — transport, scrambler, data link, PHY — ve aralarındaki L lane; parametre seti (L, M, F, S, N, N′, K) iki uçta aynı olmalı. Sağda subclass 1 zamanlaması: device clock, SYSREF kenarı her iki cihazın LMFC/LEMC sayacını hizalar, SYNC~ bırakılır, ILAS ve veri LMFC sınırında başlar, RX elastik tampon veriyi LMFC + RBD anında bırakır → deterministik gecikme.</title>
<text x="20" y="22" class="s-baslik">JESD204B/C tek bakışta — katmanlar (sol) ve SYSREF ile deterministik gecikme (sağ)</text>
<rect x="20" y="60" width="190" height="44" rx="5" class="blok-aktif"/><text x="115.0" y="79.0" text-anchor="middle" class="s-metin2">Transport</text><text x="115.0" y="93.0" text-anchor="middle" class="s-kucuk">M örnek → oktet → frame (F, S, N′)</text>
<rect x="310" y="60" width="190" height="44" rx="5" class="blok-aktif"/><text x="405.0" y="79.0" text-anchor="middle" class="s-metin2">Transport</text><text x="405.0" y="93.0" text-anchor="middle" class="s-kucuk">M örnek → oktet → frame (F, S, N′)</text>
<rect x="20" y="116" width="190" height="44" rx="5" class="blok-aktif"/><text x="115.0" y="135.0" text-anchor="middle" class="s-metin2">Scrambler</text><text x="115.0" y="149.0" text-anchor="middle" class="s-kucuk">1+x¹⁴+x¹⁵ (B) · x⁵⁸+x³⁹+1 (C)</text>
<rect x="310" y="116" width="190" height="44" rx="5" class="blok-aktif"/><text x="405.0" y="135.0" text-anchor="middle" class="s-metin2">Scrambler</text><text x="405.0" y="149.0" text-anchor="middle" class="s-kucuk">1+x¹⁴+x¹⁵ (B) · x⁵⁸+x³⁹+1 (C)</text>
<rect x="20" y="172" width="190" height="44" rx="5" class="blok-aktif"/><text x="115.0" y="191.0" text-anchor="middle" class="s-metin2">Data link</text><text x="115.0" y="205.0" text-anchor="middle" class="s-kucuk">B: CGS/ILAS, 8b/10b · C: 64b/66b</text>
<rect x="310" y="172" width="190" height="44" rx="5" class="blok-aktif"/><text x="405.0" y="191.0" text-anchor="middle" class="s-metin2">Data link</text><text x="405.0" y="205.0" text-anchor="middle" class="s-kucuk">B: CGS/ILAS, 8b/10b · C: 64b/66b</text>
<rect x="20" y="228" width="190" height="44" rx="5" class="blok"/><text x="115.0" y="247.0" text-anchor="middle" class="s-metin2">PHY (SerDes)</text><text x="115.0" y="261.0" text-anchor="middle" class="s-kucuk">CDR, eşitleme, L lane</text>
<rect x="310" y="228" width="190" height="44" rx="5" class="blok"/><text x="405.0" y="247.0" text-anchor="middle" class="s-metin2">PHY (SerDes)</text><text x="405.0" y="261.0" text-anchor="middle" class="s-kucuk">CDR, eşitleme, L lane</text>
<text x="115" y="52" text-anchor="middle" class="s-metin2">ADC = TX</text>
<text x="405" y="52" text-anchor="middle" class="s-metin2">FPGA = RX</text>
<path d="M210 250 H310" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
