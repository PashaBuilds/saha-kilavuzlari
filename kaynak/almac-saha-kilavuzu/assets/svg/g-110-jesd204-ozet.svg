<path d="M260 60 V232" class="yol-saat"/>
<text x="260" y="140" text-anchor="middle" class="s-kucuk" transform="rotate(-90 260 140)">parametreler iki uçta aynı</text>
<text x="20" y="300" class="s-kucuk">lane hızı = fs · N′ · M · (10/8 | 66/64) / L</text>
<text x="20" y="316" class="s-kucuk">Senaryo (204B): M = 1, N′ = 16, fs = 2400 MSPS → 38.4 Gb/s; L = 8 → 6.0 Gb/s/lane</text>
<text x="20" y="332" class="s-kucuk">204C (64b/66b): L = 4 → 9.9 Gb/s/lane; ek yük %3 (204B: %25)</text>
<text x="20" y="356" class="s-kucuk s-altin">Yazılımcı: SYNC~ / CGS / ILAS / veri durumları, hata sayaçları;</text>
