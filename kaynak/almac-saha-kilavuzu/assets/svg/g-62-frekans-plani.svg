<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g62">
<title id="t-g62">Referans senaryonun frekans planı: RF 9.4 GHz, low-side LO 7.6 GHz, image 5.8 GHz, half-IF spur girişi 8.5 GHz, preselector 8–11 GHz, IF bandı 1.8 ± 0.15 GHz, ilk dört Nyquist bölgesi (fs 2.4 GSPS) ve IF'in 600 MHz'e evrik katlanması; altta m×n ≤ 3 mixer ürünlerinin IF'e düşürdüğü giriş frekansları tablosu.</title>
<text x="60.0" y="22.0" text-anchor="start" class="s-baslik">Referans senaryo frekans planı — tek dönüşüm, low-side LO, direct IF sampling (2. Nyquist bölgesi)</text>
