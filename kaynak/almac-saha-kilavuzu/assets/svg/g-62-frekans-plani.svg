<line x1="120.0" y1="50" x2="120.0" y2="220" class="izgara"/><text x="120.0" y="234.0" text-anchor="middle" class="s-mono2">1</text>
<line x1="180.0" y1="50" x2="180.0" y2="220" class="izgara"/><text x="180.0" y="234.0" text-anchor="middle" class="s-mono2">2</text>
<line x1="240.0" y1="50" x2="240.0" y2="220" class="izgara"/><text x="240.0" y="234.0" text-anchor="middle" class="s-mono2">3</text>
<line x1="300.0" y1="50" x2="300.0" y2="220" class="izgara"/><text x="300.0" y="234.0" text-anchor="middle" class="s-mono2">4</text>
<line x1="360.0" y1="50" x2="360.0" y2="220" class="izgara"/><text x="360.0" y="234.0" text-anchor="middle" class="s-mono2">5</text>
<line x1="420.0" y1="50" x2="420.0" y2="220" class="izgara"/><text x="420.0" y="234.0" text-anchor="middle" class="s-mono2">6</text>
<line x1="480.0" y1="50" x2="480.0" y2="220" class="izgara"/><text x="480.0" y="234.0" text-anchor="middle" class="s-mono2">7</text>
<line x1="540.0" y1="50" x2="540.0" y2="220" class="izgara"/><text x="540.0" y="234.0" text-anchor="middle" class="s-mono2">8</text>
<line x1="600.0" y1="50" x2="600.0" y2="220" class="izgara"/><text x="600.0" y="234.0" text-anchor="middle" class="s-mono2">9</text>
<line x1="660.0" y1="50" x2="660.0" y2="220" class="izgara"/><text x="660.0" y="234.0" text-anchor="middle" class="s-mono2">10</text>
<line x1="720.0" y1="50" x2="720.0" y2="220" class="izgara"/><text x="720.0" y="234.0" text-anchor="middle" class="s-mono2">11</text>
<line x1="780.0" y1="50" x2="780.0" y2="220" class="izgara"/><text x="780.0" y="234.0" text-anchor="middle" class="s-mono2">12</text>
<line x1="840.0" y1="50" x2="840.0" y2="220" class="izgara"/><text x="840.0" y="234.0" text-anchor="middle" class="s-mono2">13</text>
<line x1="900.0" y1="50" x2="900.0" y2="220" class="izgara"/><text x="900.0" y="234.0" text-anchor="middle" class="s-mono2">14</text>
<rect x="60" y="50" width="840" height="170" class="eksen"/>
