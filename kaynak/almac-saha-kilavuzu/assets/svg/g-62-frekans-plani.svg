<rect x="405.5" y="101.0" width="5" height="119.0" class="spk-image"/>
<text x="408.0" y="96.0" text-anchor="middle" class="s-kucuk">image 5.8</text>
<rect x="567.5" y="126.5" width="5" height="93.5" class="spk-image"/>
<text x="570.0" y="121.5" text-anchor="middle" class="s-kucuk">½-IF 8.5</text>
<rect x="165.5" y="67.0" width="5" height="153.0" class="spk-sinyal"/>
<text x="168.0" y="62.0" text-anchor="middle" class="s-kucuk">IF 1.8</text>
<rect x="93.5" y="135.0" width="5" height="85.0" class="spk-gurultu"/>
<text x="96.0" y="130.0" text-anchor="middle" class="s-kucuk">alias 0.6 (evrik)</text>
<path d="M624.0 56 Q396.0 20 172.0 56" class="yol-analog" marker-end="url(#ok-analog)"/>
<text x="396.0" y="42.0" text-anchor="middle" class="s-kucuk s-altin">RF − LO = IF (düz)</text>
<path d="M408.0 90 Q288.0 60 174.0 90" class="yol-gurultu" marker-end="url(#ok-gurultu)"/>
<text x="298.0" y="112.0" text-anchor="middle" class="s-kucuk s-kirmizi">LO − image = IF de! (preselector bastırır)</text>
<path d="M168.0 190 Q132.0 150 100.0 190" class="yol-sayisal" marker-end="url(#ok-sayisal)"/>
<text x="132.0" y="146.0" text-anchor="middle" class="s-kucuk s-vurgu">ADC fs 2.4 GSPS: NZ2 → alias 0.6, evrik</text>
<text x="900.0" y="248.0" text-anchor="end" class="s-kucuk">frekans (GHz)</text>
<text x="60.0" y="275.0" text-anchor="start" class="s-baslik">Düşük mertebe mixer ürünleri m·f_in − n·LO = ±IF olan giriş frekansları (m, n ≤ 3; hesaplanmış):</text>
<text x="60.0" y="297.0" text-anchor="start" class="s-mono2 s-kucuk"> 0.600 GHz</text>
<text x="140.0" y="297.0" text-anchor="start" class="s-mono2">(m×n = 3×0)</text>
<text x="250.0" y="297.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="314.0" text-anchor="start" class="s-mono2 s-kucuk"> 0.900 GHz</text>
<text x="140.0" y="314.0" text-anchor="start" class="s-mono2">(m×n = 2×0)</text>
<text x="250.0" y="314.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="331.0" text-anchor="start" class="s-mono2 s-kucuk"> 1.800 GHz</text>
<text x="140.0" y="331.0" text-anchor="start" class="s-mono2">(m×n = 1×0)</text>
<text x="250.0" y="331.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="348.0" text-anchor="start" class="s-mono2 s-kucuk"> 1.933 GHz</text>
<text x="140.0" y="348.0" text-anchor="start" class="s-mono2">(m×n = 3×1)</text>
<text x="250.0" y="348.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="365.0" text-anchor="start" class="s-mono2 s-kucuk"> 2.900 GHz</text>
<text x="140.0" y="365.0" text-anchor="start" class="s-mono2">(m×n = 2×1)</text>
<text x="250.0" y="365.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="382.0" text-anchor="start" class="s-mono2 s-kucuk"> 3.133 GHz</text>
<text x="140.0" y="382.0" text-anchor="start" class="s-mono2">(m×n = 3×1)</text>
<text x="250.0" y="382.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="399.0" text-anchor="start" class="s-mono2 s-kucuk"> 4.467 GHz</text>
<text x="140.0" y="399.0" text-anchor="start" class="s-mono2">(m×n = 3×2)</text>
<text x="250.0" y="399.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="416.0" text-anchor="start" class="s-mono2 s-kucuk"> 4.700 GHz</text>
<text x="140.0" y="416.0" text-anchor="start" class="s-mono2">(m×n = 2×1)</text>
<text x="250.0" y="416.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="433.0" text-anchor="start" class="s-mono2 s-kucuk"> 5.667 GHz</text>
<text x="140.0" y="433.0" text-anchor="start" class="s-mono2">(m×n = 3×2)</text>
<text x="250.0" y="433.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="450.0" text-anchor="start" class="s-mono2 s-kucuk"> 5.800 GHz</text>
<text x="140.0" y="450.0" text-anchor="start" class="s-mono2">(m×n = 1×1)</text>
<text x="250.0" y="450.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="490.0" y="297.0" text-anchor="start" class="s-mono2 s-kucuk"> 6.700 GHz</text>
<text x="570.0" y="297.0" text-anchor="start" class="s-mono2">(m×n = 2×2)</text>
<text x="680.0" y="297.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="490.0" y="314.0" text-anchor="start" class="s-mono2 s-kucuk"> 7.000 GHz</text>
<text x="570.0" y="314.0" text-anchor="start" class="s-mono2">(m×n = 3×3)</text>
<text x="680.0" y="314.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="490.0" y="331.0" text-anchor="start" class="s-mono2 s-kirmizi"> 8.200 GHz</text>
<text x="570.0" y="331.0" text-anchor="start" class="s-mono2">(m×n = 3×3)</text>
<text x="680.0" y="331.0" text-anchor="start" class="s-kucuk s-kirmizi">preselector İÇİNDE → tehlikeli</text>
<text x="490.0" y="348.0" text-anchor="start" class="s-mono2 s-kirmizi"> 8.500 GHz</text>
<text x="570.0" y="348.0" text-anchor="start" class="s-mono2">(m×n = 2×2)</text>
<text x="680.0" y="348.0" text-anchor="start" class="s-kucuk s-kirmizi">preselector İÇİNDE → tehlikeli</text>
<text x="490.0" y="365.0" text-anchor="start" class="s-mono2 s-vurgu"> 9.400 GHz</text>
<text x="570.0" y="365.0" text-anchor="start" class="s-mono2">(m×n = 1×1)</text>
<text x="680.0" y="365.0" text-anchor="start" class="s-kucuk s-vurgu">istenen</text>
<text x="490.0" y="382.0" text-anchor="start" class="s-mono2 s-kirmizi">10.500 GHz</text>
<text x="570.0" y="382.0" text-anchor="start" class="s-mono2">(m×n = 2×3)</text>
<text x="680.0" y="382.0" text-anchor="start" class="s-kucuk s-kirmizi">preselector İÇİNDE → tehlikeli</text>
<text x="490.0" y="399.0" text-anchor="start" class="s-mono2 s-kucuk">12.300 GHz</text>
<text x="570.0" y="399.0" text-anchor="start" class="s-mono2">(m×n = 2×3)</text>
<text x="680.0" y="399.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="490.0" y="416.0" text-anchor="start" class="s-mono2 s-kucuk">13.400 GHz</text>
<text x="570.0" y="416.0" text-anchor="start" class="s-mono2">(m×n = 1×2)</text>
<text x="680.0" y="416.0" text-anchor="start" class="s-kucuk s-kucuk">preselector dışında</text>
<text x="60.0" y="470.0" text-anchor="start" class="s-kucuk">Okuma: 8.5 GHz'deki bir giriş 2×2 ürünüyle (2·8.5 − 2·7.6 = 1.8) IF'e düşer — 'half-IF spur'. Preselector 8–11 GHz bandının içinde kaldığından</text>
<text x="60.0" y="486.0" text-anchor="start" class="s-kucuk">yalnızca mixer'ın kendi 2×2 bastırması (tipik 50–70 dBc, doğrulanmadı) korur. 10.5 GHz'deki 2×3 ürünü de banttadır ama üçüncü mertebe LO çarpanı zayıftır.</text>
<text x="60.0" y="502.0" text-anchor="start" class="s-kucuk">Image (5.8) ve 1×2 ürünü (13.4) preselector dışındadır: filtre bastırması + mixer izolasyonu yeter. Bu tablo W-05'te canlı olarak yeniden üretilir.</text>
<text x="60.0" y="530.0" text-anchor="start" class="s-kucuk s-altin">Frekans planı bir 'temiz pencere' aramasıdır: IF öyle seçilir ki image ve düşük mertebe spur'lar preselector'ın reddettiği yere düşsün, IF de ADC'nin iyi çalıştığı Nyquist bölgesine otursun.</text>
</svg>