<rect x="132.0" y="206" width="72.0" height="14" class="spk-sinyal" opacity="0.35"/>
<text x="168.0" y="216.0" text-anchor="middle" class="s-kucuk">NZ2</text>
<rect x="204.0" y="206" width="72.0" height="14" class="spk-gurultu" opacity="0.15"/>
<text x="240.0" y="216.0" text-anchor="middle" class="s-kucuk">NZ3</text>
<rect x="276.0" y="206" width="72.0" height="14" class="spk-gurultu" opacity="0.15"/>
<text x="312.0" y="216.0" text-anchor="middle" class="s-kucuk">NZ4</text>
