<!-- sayı etiketleri (referans senaryo) -->
<g style="font-family:var(--mono);font-size:9.5px" fill="var(--ink-2)">
  <text x="60" y="176">−60 dBm tepe · PW 1 µs</text>
  <text x="60" y="188">PRI 1 ms · BW ≈ 2 MHz</text>
  <text x="192" y="140" fill="var(--gold)">G 20 dB · NF 2 dB</text>
  <text x="256" y="140" fill="var(--gold)">image 5.8 GHz −60 dB</text>
  <text x="402" y="88" fill="var(--gold)">IF 1.8 GHz · sistem NF 6 dB</text>
  <text x="402" y="100" fill="var(--gold)">ADC girişi −20 dBm = −24 dBFS</text>
  <text x="600" y="60" fill="var(--ink-2)">fs 2400 MSPS · jitter 100 fs</text>
  <text x="600" y="72" fill="var(--ink-2)">2. Nyquist bölgesi → 600 MHz, evrik</text>
  <text x="600" y="84" fill="var(--ink-2)">SNR_q 86 dB · SNR_j 65 dB</text>
  <text x="600" y="96" fill="var(--ink-2)">taban −83.2 dBm (300 MHz) → SNR 23 dB</text>
  <text x="586" y="220" fill="var(--accent)">SSR-8 × 300 MHz · 38.4 Gbps</text>
  <text x="30" y="410" fill="var(--accent)">FTW 0x40000000 · Δf 0.56 Hz</text>
  <text x="104" y="358" fill="var(--accent)">CIC ↓4 (R=4,N=4) + HB ↓2</text>
  <text x="104" y="370" fill="var(--accent)">±150 MHz · 16+16 bit · 9.6 Gbps</text>
  <text x="104" y="382" fill="var(--accent)">işlem kazancı +6 dB · 300 örnek/darbe</text>
  <text x="300" y="420" fill="var(--accent)">I²+Q² · 20 bit</text>
  <text x="372" y="420" fill="var(--accent)">CA N=16 G=2 · α 21.94 · Pfa 1e−6 → 300 FA/s</text>
  <text x="524" y="420" fill="var(--accent)">histerezis 3 dB · min PW 4</text>
  <text x="600" y="420" fill="var(--accent)">TOA ±1 ns · PW ±3 ns · PA ±0.3 dB</text>
  <text x="300" y="520" fill="var(--accent)">Hann · %50 overlap</text>
  <text x="372" y="520" fill="var(--accent)">1024 nokta · bin 293 kHz · 3.4 µs</text>
  <text x="444" y="532" fill="var(--accent)">+27 dB işlem kazancı · pencere kaybı −5.3 dB</text>
  <text x="720" y="456" fill="var(--accent)">128 bit · 1000 PDW/s</text>
  <text x="720" y="468" fill="var(--accent)">indirgeme 75 000 : 1</text>
  <text x="830" y="456" fill="var(--accent)">4096 derinlik · latency hizası 2.5 µs</text>
  <text x="1040" y="560" fill="var(--green)">read(): 128 kbps</text>
  <text x="1040" y="572" fill="var(--green)">RF geri: 9.4 GHz</text>
  <text x="26" y="600" fill="var(--ink-3)">Sayılar kurgusal referans senaryodur (Bölüm 0, Bölüm 28). Latency: darbe bitti → PDW ≈ 4 µs.</text>
  <text x="26" y="614" fill="var(--ink-3)">Bit bütçesi: 14 → 16 → 32 → 26 (CIC) → 18 → 16 (I/Q) → 20 (güç) → 18 (FFT) → 128 (PDW).</text>
</g>
