<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g280">
<title id="t-g280">Poster şemanın referans senaryo sayılarıyla dolu hali: her durakta frekans, fs, bit, veri hızı, seviye ve SNR (−60 dBm 9.4 GHz darbe → 1.8 GHz IF → 2400 MSPS 14 bit → 600 MHz evrik → NCO 600 MHz → ↓8 → 300 MSPS I/Q, SNR 23 dB → CFAR α 21.9 → FFT 1024 bin 293 kHz → 128-bit PDW, 75 000:1 indirgeme)</title>
