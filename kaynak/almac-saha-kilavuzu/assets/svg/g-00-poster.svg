<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g00">
<title id="t-g00">Poster şema — Antenden PDW'ye: RF dünyası (anten, limiter, LNA, preselector, mixer ve LO, IF filtre ve kazanç, anti-alias), veri dönüştürme (ADC, JESD/SSR arayüzü), sayısal dünya (NCO, kompleks mixer, filtre ve decimation; zaman kolu: zarf, gürültü tahmini, eşik, darbe FSM, ölçüm; frekans kolu: pencere, FFT, tepe bulma; PDW birleştirme, FIFO) ve yazılım dünyası (DMA, PS). Her blok ilgili bölüme bağlıdır.</title>
<style>
  .p-band { fill: none; stroke-dasharray: 6 5; stroke-width: 1.2; }
  .p-et { font-family: var(--sans); font-size: 10px; fill: var(--ink-2); }
  .p-ad { font-family: var(--sans); font-size: 11px; fill: var(--ink); font-weight: 600; }
  .p-b  { font-family: var(--mono); font-size: 10px; fill: var(--ink-3); }
  .p-bas { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
</style>
<!-- dünya bantları -->
<rect x="14" y="14" width="392" height="200" rx="10" class="p-band" stroke="var(--gold)"/>
<text x="26" y="34" class="p-bas" fill="var(--gold)">RF DÜNYASI · analog</text>
<rect x="416" y="14" width="150" height="200" rx="10" class="p-band" stroke="var(--ink-2)"/>
<text x="428" y="34" class="p-bas" fill="var(--ink-2)">VERİ DÖNÜŞTÜRME</text>
<rect x="14" y="230" width="1000" height="316" rx="10" class="p-band" stroke="var(--accent)"/>
<text x="26" y="250" class="p-bas" fill="var(--accent)">SAYISAL DÜNYA · FPGA (PL)</text>
<rect x="1024" y="230" width="142" height="316" rx="10" class="p-band" stroke="var(--green)"/>
<text x="1036" y="250" class="p-bas" fill="var(--green)">YAZILIM · PS</text>
