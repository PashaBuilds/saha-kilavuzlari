<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g201">
<title id="t-g201">Darbe ile FFT çerçevesinin hizalanması. Sol sütun zaman çizelgeleri: (a) N = 1024 çerçeve (3.41 µs) 1 µs darbeyi içine alır ama doluluk yalnızca %29'dur, gürültü tüm çerçeveden toplanır → 5.3 dB SNR kaybı; (b) overlap'siz ardışık çerçevelerde darbe sınıra denk gelirse ikiye bölünür, %50 overlap'li ara çerçeve darbeyi bütün yakalar; (c) N = 256 çerçeve (0.85 µs) darbenin içinde kalır, SNR kaybı yok ama bin 1.17 MHz. Sağ sütun: aynı gürültülü darbenin hesaplanmış spektrumları — N = 1024'te tepe−taban 29 dB, N = 256'da 34 dB; bin genişliği 4 kat kabalaşır.</title>
<text x="50" y="40" class="s-baslik">(a) N = 1024 — çerçeve darbeden uzun</text>
<path d="M50.0 70 H167.0 V44 H264.5 V70 H440.0" class="yol-analog" stroke="var(--accent)" stroke-width="2"/>
<rect x="167.0" y="44" width="97.5" height="26" fill="var(--accent-soft)"/>
<rect x="49.3" y="76" width="332.8" height="16" fill="var(--gold)" opacity="0.35" stroke="var(--gold)" stroke-width="1"/>
<text x="215.8" y="88" text-anchor="middle" class="s-kucuk">çerçeve 3.41 µs</text>
<text x="50" y="114" class="s-kucuk">darbe 300 / 1024 örnek = %29 doluluk → SNR kaybı 10·log10(1024/300) = 5.3 dB; bin 293 kHz</text>
<text x="50" y="175" class="s-baslik">(b) çerçeve sınırı darbeyi böler — overlap kurtarır</text>
<path d="M50.0 205 H167.0 V179 H264.5 V205 H440.0" class="yol-analog" stroke="var(--accent)" stroke-width="2"/>
<rect x="167.0" y="179" width="97.5" height="26" fill="var(--accent-soft)"/>
<rect x="-106.0" y="211" width="332.8" height="16" fill="var(--gold)" opacity="0.25" stroke="var(--gold)" stroke-width="1"/>
<rect x="226.8" y="211" width="332.8" height="16" fill="var(--gold)" opacity="0.25" stroke="var(--gold)" stroke-width="1"/>
<text x="393.2" y="223" text-anchor="middle" class="s-kucuk">çerçeve 1</text>
<rect x="559.6" y="211" width="332.8" height="16" fill="var(--gold)" opacity="0.25" stroke="var(--gold)" stroke-width="1"/>
<text x="726.0" y="223" text-anchor="middle" class="s-kucuk">çerçeve 2</text>
<rect x="393.2" y="231" width="332.8" height="16" fill="var(--green)" opacity="0.3" stroke="var(--green)" stroke-width="1"/>
<text x="559.6" y="243" text-anchor="middle" class="s-kucuk">%50 overlap çerçevesi: darbe bütün</text>
<text x="50" y="265" class="s-kucuk">overlap'siz: 0.4 + 0.6 µs'lik iki parça, iki çerçevede iki zayıf tepe (−8 ve −4.4 dB). %50 overlap: en kötü durumda bile bir çerçeve darbenin ≥ %75'ini içerir.</text>
<text x="50" y="310" class="s-baslik">(c) N = 256 — çerçeve darbenin içinde</text>
<path d="M50.0 340 H167.0 V314 H264.5 V340 H440.0" class="yol-analog" stroke="var(--accent)" stroke-width="2"/>
<rect x="167.0" y="314" width="97.5" height="26" fill="var(--accent-soft)"/>
<rect x="152.4" y="346" width="83.2" height="16" fill="var(--gold)" opacity="0.3" stroke="var(--gold)" stroke-width="1"/>
<rect x="194.0" y="364" width="83.2" height="16" fill="var(--gold)" opacity="0.3" stroke="var(--gold)" stroke-width="1"/>
<text x="235.6" y="376" text-anchor="middle" class="s-kucuk">0.85 µs</text>
<rect x="235.6" y="346" width="83.2" height="16" fill="var(--gold)" opacity="0.3" stroke="var(--gold)" stroke-width="1"/>
<text x="50" y="400" class="s-kucuk">tam doluluk → SNR kaybı yok; ama bin = 300/256 = 1.17 MHz (4× kaba). Zaman–frekans takası: kısa darbe için ideal N ≈ darbe örnek sayısı (300).</text>
<line x1="50.0" y1="410" x2="50.0" y2="414" class="izgara"/><text x="50.0" y="428" text-anchor="middle" class="s-mono2">0 µs</text><line x1="147.5" y1="410" x2="147.5" y2="414" class="izgara"/><text x="147.5" y="428" text-anchor="middle" class="s-mono2">1 µs</text><line x1="245.0" y1="410" x2="245.0" y2="414" class="izgara"/><text x="245.0" y="428" text-anchor="middle" class="s-mono2">2 µs</text><line x1="342.5" y1="410" x2="342.5" y2="414" class="izgara"/><text x="342.5" y="428" text-anchor="middle" class="s-mono2">3 µs</text><line x1="440.0" y1="410" x2="440.0" y2="414" class="izgara"/><text x="440.0" y="428" text-anchor="middle" class="s-mono2">4 µs</text><rect x="50" y="410" width="390" height="4" class="eksen"/>
<text x="520" y="30" class="s-baslik">N = 1024 (çerçeve darbeyi kapsar)</text>
