<line x1="520" y1="310.4" x2="870" y2="310.4" class="yol-gurultu"/>
<text x="866" y="306.4" text-anchor="end" class="s-kucuk s-kirmizi">taban ort. -34.2 dB</text>
<text x="526" y="239" class="s-kucuk">tepe 0.1 dB · Δ 34.2 dB (teori 34.1) · bin 1.17 MHz</text>
<text x="870" y="371" text-anchor="end" class="s-kucuk">frekans (MHz) · dB (tam ölçek CW = 0)</text>
<text x="520" y="430" class="s-metin2">Örnek başına SNR 10 dB, aynı gürültü gerçekleşmesi.</text>
<text x="520" y="448" class="s-metin2">tepe − taban = SNR_örnek + 10·log10(L²/N), L = çerçevedeki darbe örneği.</text>
<text x="520" y="466" class="s-metin2">N = L (300) en iyi: 10 + 24.8 = 34.8 dB. N = 1024: 29.4 dB (−5.3). N = 64: 28.1 dB.</text>
<text x="50" y="500" class="s-metin2">Kural: çerçeve darbeden uzunsa fazla kısım yalnızca gürültü ekler (kayıp 10·log10(N/L)); kısaysa çözünürlük ve frekans doğruluğu düşer.</text>
<text x="50" y="520" class="s-metin2">Bilinmeyen PW için pratik: %50 overlap + darbe FSM'inin (Bölüm 26) verdiği başlangıç/bitiş ile sonradan çerçeve seçimi ya da iki paralel N.</text>
</svg>