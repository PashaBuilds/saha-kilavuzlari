<text x="866" y="134.1" text-anchor="end" class="s-kucuk s-kirmizi">taban ort. -40.0 dB</text>
<text x="526" y="54" class="s-kucuk">tepe -10.6 dB · Δ 29.4 dB (teori 29.4) · bin 0.29 MHz</text>
<text x="870" y="186" text-anchor="end" class="s-kucuk">frekans (MHz) · dB (tam ölçek CW = 0)</text>
<text x="520" y="215" class="s-baslik">N = 256 (çerçeve darbenin içinde)</text>
<line x1="520.0" y1="225" x2="520.0" y2="345" class="izgara"/><text x="520.0" y="359" text-anchor="middle" class="s-mono2">0</text><line x1="636.7" y1="225" x2="636.7" y2="345" class="izgara"/><text x="636.7" y="359" text-anchor="middle" class="s-mono2">10</text><line x1="753.3" y1="225" x2="753.3" y2="345" class="izgara"/><text x="753.3" y="359" text-anchor="middle" class="s-mono2">20</text><line x1="870.0" y1="225" x2="870.0" y2="345" class="izgara"/><text x="870.0" y="359" text-anchor="middle" class="s-mono2">30</text><line x1="520" y1="235.9" x2="870" y2="235.9" class="izgara"/><text x="514" y="239.9" text-anchor="end" class="s-mono2">0</text><line x1="520" y1="279.5" x2="870" y2="279.5" class="izgara"/><text x="514" y="283.5" text-anchor="end" class="s-mono2">-20</text><line x1="520" y1="323.2" x2="870" y2="323.2" class="izgara"/><text x="514" y="327.2" text-anchor="end" class="s-mono2">-40</text><rect x="520" y="225" width="350" height="120" class="eksen"/>
