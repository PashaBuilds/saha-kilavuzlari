<svg viewBox="0 0 860 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g79">
<title id="t-g79">M-10 monobit almaç blok şeması: anten → limiter/yükselteç → BPF → 1-bit ADC (işaret karşılaştırıcı, çok yüksek fs) → çarpımsız monobit FFT → tepe bulma → kaba frekans ve TOA. Not: çok küçük mantık, çok düşük dinamik aralık.</title>
<text x="20.0" y="24.0" text-anchor="start" class="s-baslik">M-10 · Monobit almaç — 1 bitlik ADC + FFT: en ucuz geniş bant frekans ölçer (kavram)</text>
<use href="#sym-anten" x="20.0" y="60.0" width="60" height="40"/>
<text x="50.0" y="113.0" text-anchor="middle" class="s-kucuk">anten</text>
<path d="M80.0 80.0 L130.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-limiter" x="130.0" y="60.0" width="60" height="40"/>
<text x="160.0" y="113.0" text-anchor="middle" class="s-kucuk">limiter / amp</text>
<text x="160.0" y="125.0" text-anchor="middle" class="s-mono2">sabit genlik</text>
<path d="M190.0 80.0 L240.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-bpf" x="240.0" y="60.0" width="60" height="40"/>
<text x="270.0" y="113.0" text-anchor="middle" class="s-kucuk">BPF</text>
<path d="M300.0 80.0 L350.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-cmp" x="350.0" y="60.0" width="60" height="40"/>
<text x="380.0" y="113.0" text-anchor="middle" class="s-kucuk">1-bit ADC</text>
<text x="380.0" y="125.0" text-anchor="middle" class="s-mono2">işaret karşılaştırıcı</text>
<path d="M410.0 80.0 L460.0 80.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fft" x="460.0" y="60.0" width="60" height="40"/>
<text x="490.0" y="113.0" text-anchor="middle" class="s-kucuk">monobit FFT</text>
<text x="490.0" y="125.0" text-anchor="middle" class="s-mono2">çarpımsız (±1, ±j)</text>
<path d="M520.0 80.0 L570.0 80.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<use href="#sym-cmp" x="570.0" y="60.0" width="60" height="40"/>
<text x="600.0" y="113.0" text-anchor="middle" class="s-kucuk">tepe bul</text>
<use href="#sym-saat" x="316.0" y="130.0" width="60" height="40"/>
<text x="346.0" y="183.0" text-anchor="middle" class="s-kucuk">çok yüksek fs</text>
<text x="346.0" y="195.0" text-anchor="middle" class="s-mono2">(≈ 2.5 GSPS+)</text>
<path d="M346.0 130.0 L346.0 100.0" class="yol-saat" fill="none" marker-end="url(#ok-saat)"/>
<path d="M630.0 80.0 L660.0 80.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<text x="664.0" y="84.0" text-anchor="start" class="s-kucuk s-vurgu">f (kaba), TOA</text>
<rect x="20.0" y="190.0" width="820.0" height="60.0" rx="6" class="blok" opacity=".8"/>
<text x="30.0" y="208.0" text-anchor="start" class="s-kucuk">Girişin yalnızca işareti örneklenir; FFT'nin twiddle çarpanları da ±1, ±j'ye yuvarlanır → çarpma yok, çok küçük mantık, çok yüksek fs. Tek sinyalde frekans doğruluğu şaşırtıcı iyidir.</text>
<text x="30.0" y="224.0" text-anchor="start" class="s-kucuk">Bedeli dinamik aralık: 1 bit, güçlü sinyalin yanındaki zayıfı yutar (~20 dB anlık DR, doğrulanmadı) ve eşzamanlı iki sinyalde güçlü olan kazanır. Genlik bilgisi yoktur.</text>
<text x="30.0" y="240.0" text-anchor="start" class="s-kucuk s-altin">Kavramsal önemi: 'bit sayısı' ile 'bant genişliği' arasındaki takasın en uç noktası; IFM'in sayısal, FFT tabanlı akrabası.</text>
</svg>