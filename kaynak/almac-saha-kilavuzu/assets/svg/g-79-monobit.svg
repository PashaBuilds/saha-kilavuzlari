<svg viewBox="0 0 860 298" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g79">
<title id="t-g79">M-10 monobit almaç blok şeması: anten → limiter/yükselteç → BPF → 1-bit ADC (işaret karşılaştırıcı, çok yüksek fs) → çarpımsız monobit FFT → tepe bulma → kaba frekans ve TOA. Not: çok küçük mantık, çok düşük dinamik aralık.</title>
<text x="20.0" y="24.0" text-anchor="start" class="s-baslik">M-10 · Monobit almaç — 1 bitlik ADC + FFT: en ucuz geniş bant frekans ölçer (kavram)</text>
<use href="#sym-anten" x="20.0" y="60.0" width="60" height="40"/>
<text x="50.0" y="113.0" text-anchor="middle" class="s-kucuk">anten</text>
<path d="M80.0 80.0 L140.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-limiter" x="140.0" y="60.0" width="60" height="40"/>
<text x="170.0" y="113.0" text-anchor="middle" class="s-kucuk">limiter / amp</text>
<text x="170.0" y="125.0" text-anchor="middle" class="s-mono2">sabit genlik</text>
<path d="M200.0 80.0 L260.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-bpf" x="260.0" y="60.0" width="60" height="40"/>
<text x="290.0" y="113.0" text-anchor="middle" class="s-kucuk">BPF</text>
<path d="M320.0 80.0 L380.0 80.0" class="yol-analog" fill="none" marker-end="url(#ok-analog)"/>
<use href="#sym-cmp" x="380.0" y="60.0" width="60" height="40"/>
<path d="M440.0 80.0 L500.0 80.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<use href="#sym-fft" x="500.0" y="60.0" width="60" height="40"/>
<text x="530.0" y="113.0" text-anchor="middle" class="s-kucuk">monobit FFT</text>
<text x="530.0" y="125.0" text-anchor="middle" class="s-mono2">çarpımsız (±1, ±j)</text>
<path d="M560.0 80.0 L620.0 80.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<use href="#sym-cmp" x="620.0" y="60.0" width="60" height="40"/>
<text x="650.0" y="113.0" text-anchor="middle" class="s-kucuk">tepe bul</text>
<text x="410.0" y="125.0" text-anchor="middle" class="s-kucuk">1-bit ADC</text>
<text x="410.0" y="137.0" text-anchor="middle" class="s-mono2">işaret karşılaştırıcı</text>
<use href="#sym-saat" x="300.0" y="150.0" width="60" height="40"/>
<text x="330.0" y="203.0" text-anchor="middle" class="s-kucuk">çok yüksek fs</text>
<text x="330.0" y="215.0" text-anchor="middle" class="s-mono2">(≈ 2.5 GSPS+)</text>
<path d="M330 150 V110 H395 V100" class="yol-saat" fill="none" marker-end="url(#ok-saat)"/>
<path d="M680.0 80.0 L710.0 80.0" class="yol-sayisal" fill="none" marker-end="url(#ok-sayisal)"/>
<text x="714.0" y="84.0" text-anchor="start" class="s-kucuk s-vurgu">f (kaba), TOA</text>
<rect x="20.0" y="226.0" width="820.0" height="60.0" rx="6" class="blok" opacity=".8"/>
<text x="30.0" y="244.0" text-anchor="start" class="s-kucuk">Girişin yalnızca işareti örneklenir; FFT'nin twiddle çarpanları da ±1, ±j'ye yuvarlanır → çarpma yok, çok küçük mantık, çok yüksek fs. Tek sinyalde frekans doğruluğu şaşırtıcı iyidir.</text>
<text x="30.0" y="260.0" text-anchor="start" class="s-kucuk">Bedeli dinamik aralık: 1 bit, güçlü sinyalin yanındaki zayıfı yutar (~20 dB anlık DR, doğrulanmadı) ve eşzamanlı iki sinyalde güçlü olan kazanır. Genlik bilgisi yoktur.</text>
<text x="30.0" y="276.0" text-anchor="start" class="s-kucuk s-altin">Kavramsal önemi: 'bit sayısı' ile 'bant genişliği' arasındaki takasın en uç noktası; IFM'in sayısal, FFT tabanlı akrabası.</text>
</svg>