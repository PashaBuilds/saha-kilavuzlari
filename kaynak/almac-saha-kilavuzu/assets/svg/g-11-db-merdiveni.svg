<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-g11">
<title id="t-g11">dB merdiveni: −180 dBm'den +40 dBm'e düşey eksen. Solda her 10 dB'de mutlak güç (W) ve 50 Ω'daki rms gerilim; sağda kTB (−174 dBm/Hz), 2 MHz ve 300 MHz bantta gürültü tabanı, referans senaryonun MDS'i (−68.2 dBm), gelen darbe (−60 dBm), LNA çıkışı, ADC tam ölçeği (+4 dBm), 1 mW (0 dBm) ve 1 W (+30 dBm) işaretli. Sağ altta 3/6/10/20 dB ezber kartı.</title>
